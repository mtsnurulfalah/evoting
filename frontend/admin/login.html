<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login Admin — eVoting OSIM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <link rel="stylesheet" href="../assets/css/tailwind.css"/>
</head>
<body class="h-full min-h-screen bg-gray-100 flex items-center justify-center p-4">

<div id="toast-container"></div>

<div class="w-full max-w-sm">
  <!-- Brand -->
  <div class="text-center mb-6">
    <div class="inline-flex items-center justify-center w-14 h-14 bg-primary-600 rounded-2xl shadow-lg mb-3">
      <i class="fa-solid fa-shield-halved text-white text-2xl"></i>
    </div>
    <h1 class="text-xl font-bold text-gray-800" data-app-name>eVoting OSIM</h1>
    <p class="text-gray-500 text-sm mt-0.5">Panel Administrasi</p>
  </div>

  <!-- Form card -->
  <div class="card shadow-xl">
    <div class="card-body py-7 px-7">
      <h2 class="text-base font-semibold text-gray-800 mb-5 text-center">Masuk sebagai Administrator</h2>

      <form id="login-form" novalidate>
        <!-- Username -->
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"><i class="fa-solid fa-user fa-sm"></i></span>
            <input type="text" id="username" name="username"
              class="form-input pl-9" placeholder="Username admin" autocomplete="username"/>
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"><i class="fa-solid fa-lock fa-sm"></i></span>
            <input type="password" id="password" name="password"
              class="form-input pl-9 pr-10" placeholder="Password" autocomplete="current-password"/>
            <button type="button" id="toggle-password" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition-colors" aria-label="Tampilkan password">
              <i class="fa-solid fa-eye fa-sm"></i>
            </button>
          </div>
        </div>

        <!-- Error -->
        <div id="login-error" class="alert alert-error hidden mb-4 text-sm">
          <i class="fa-solid fa-circle-xmark flex-shrink-0"></i>
          <span id="login-error-text"></span>
        </div>

        <button type="submit" id="login-btn" class="btn btn-primary w-full btn-lg mt-1">
          <i class="fa-solid fa-right-to-bracket"></i>
          Masuk
        </button>
      </form>
    </div>
  </div>

  <p class="text-center text-xs text-gray-400 mt-5">
    <a href="/index.html" class="hover:text-gray-600 transition-colors">
      <i class="fa-solid fa-arrow-left mr-1"></i> Kembali ke halaman pemilihan
    </a>
  </p>
</div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/utils.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/components.js"></script>
<script>
(async () => {
  if (Auth.isAdmin()) { window.location.replace('./dashboard.html'); return; }

  loadAppConfig();

  // Toggle password
  const toggleBtn = document.getElementById('toggle-password');
  const pwInput   = document.getElementById('password');
  toggleBtn.addEventListener('click', () => {
    const show = pwInput.type === 'password';
    pwInput.type = show ? 'text' : 'password';
    toggleBtn.querySelector('i').className = `fa-solid fa-${show ? 'eye-slash' : 'eye'} fa-sm`;
  });

  // Enter key on username → focus password
  document.getElementById('username').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('password').focus();
  });

  // Clear error on input
  ['username','password'].forEach(id => {
    document.getElementById(id).addEventListener('input', () => {
      document.getElementById('login-error').classList.add('hidden');
    });
  });

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn      = document.getElementById('login-btn');
    const errBox   = document.getElementById('login-error');
    const errText  = document.getElementById('login-error-text');
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    if (!username || !password) {
      errText.textContent = 'Username dan password harus diisi.';
      errBox.classList.remove('hidden');
      return;
    }

    Utils.setLoading(btn, true, 'Memverifikasi...');
    errBox.classList.add('hidden');

    const res = await API.auth.adminLogin({ username, password });

    if (res.success) {
      Auth.setAdminSession(res.data);
      btn.innerHTML = '<i class="fa-solid fa-circle-check"></i> Berhasil!';
      btn.classList.add('bg-green-600');
      setTimeout(() => window.location.href = './dashboard.html', 600);
    } else {
      Utils.setLoading(btn, false);
      errText.textContent = res.message || 'Username atau password salah.';
      errBox.classList.remove('hidden');
      document.getElementById('password').value = '';
      document.getElementById('password').focus();
    }
  });
})();
</script>
</body>
</html>
