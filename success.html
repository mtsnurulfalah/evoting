<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
  <meta charset="UTF-8"/>
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Suara Berhasil — eVoting OSIM</title>
  <meta name="description" content="Suara Anda telah berhasil tercatat di sistem eVoting OSIM/S"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <link rel="stylesheet" href="/assets/css/tailwind.css"/>
  <style>
    /* Cegah horizontal overflow di semua kondisi */
    body { overflow-x: hidden; max-width: 100vw; }

    /* ── Animasi ikon sukses ── */
    @keyframes scaleIn {
      from { transform: scale(0); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }
    .anim-scale-in {
      animation: scaleIn 0.48s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    /* ── Animasi konten masuk dari bawah ── */
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .anim-slide-up  { animation: slideUp 0.42s ease-out both; }
    .anim-delay-1   { animation-delay: 0.12s; }
    .anim-delay-2   { animation-delay: 0.24s; }
    .anim-delay-3   { animation-delay: 0.36s; }
    .anim-delay-4   { animation-delay: 0.46s; }

    /* ── Confetti ── */
    .confetti-piece {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      animation: confettiFall linear forwards;
    }
    @keyframes confettiFall {
      0%   { transform: translateY(-20px) rotate(0deg);   opacity: 1; }
      100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
    }

    /* ── Countdown ring SVG ── */
    .countdown-ring { transition: stroke-dashoffset 1s linear; }

    /* ── Safe-area untuk iOS home indicator ── */
    .safe-bottom { padding-bottom: max(1.5rem, env(safe-area-inset-bottom, 0px)); }

    /* ── Multi-election summary item ── */
    .election-summary-item {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 0.75rem 0;
      border-bottom: 1px solid #f3f4f6;
    }
    .election-summary-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }
    .election-summary-item:first-child { padding-top: 0; }

    /* ── Checkmark masuk per baris dengan delay ── */
    @keyframes checkBounce {
      0%   { transform: scale(0) rotate(-10deg); opacity: 0; }
      65%  { transform: scale(1.2) rotate(3deg);  opacity: 1; }
      100% { transform: scale(1)   rotate(0deg);  opacity: 1; }
    }
    .check-bounce { animation: checkBounce 0.38s cubic-bezier(0.34, 1.56, 0.64, 1) both; }

    /* ── Countdown text urgent pulse ── */
    @keyframes urgentPulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.55; }
    }
    .urgent-pulse { animation: urgentPulse 1s ease-in-out infinite; }

    /* ── Card divider label ── */
    .card-section-label {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: #9ca3af;
      display: flex;
      align-items: center;
      gap: 0.375rem;
      margin-bottom: 0.75rem;
    }

    /* ── Detail DL row ── */
    .detail-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
      font-size: 0.875rem;
      padding: 0.375rem 0;
      border-bottom: 1px solid #f9fafb;
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-row dt { color: #6b7280; flex-shrink: 0; padding-top: 1px; }
    .detail-row dd { color: #1f2937; font-weight: 500; text-align: right;
                     min-width: 0; word-break: break-word; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-green-50 via-white to-primary-50 flex flex-col">

<div id="toast-container"></div>
<div id="confetti-container" aria-hidden="true"></div>

<!-- ══════════════════════════════════════════════════════════
     TOPBAR
════════════════════════════════════════════════════════════ -->
<header class="bg-white/90 backdrop-blur-sm border-b border-gray-100 py-3 px-4 sticky top-0 z-20">
  <div class="max-w-xl mx-auto flex items-center justify-between gap-3">
    <!-- Kiri: logo + nama app -->
    <div class="flex items-center gap-2 min-w-0">
      <div class="w-7 h-7 bg-primary-600 rounded-lg flex items-center justify-center
                  flex-shrink-0 overflow-hidden" data-school-logo>
        <i class="fa-solid fa-box-ballot text-white text-xs" aria-hidden="true"></i>
      </div>
      <span class="text-sm font-semibold text-gray-700 truncate" data-app-name>eVoting OSIM</span>
    </div>
    <!-- Kanan: tombol keluar -->
    <button id="logout-btn-top"
            class="btn btn-sm btn-secondary flex-shrink-0"
            aria-label="Keluar dari sistem">
      <i class="fa-solid fa-right-from-bracket text-xs" aria-hidden="true"></i>
      <span class="hidden sm:inline text-xs">Keluar</span>
    </button>
  </div>
</header>

<!-- ══════════════════════════════════════════════════════════
     MAIN CONTENT
════════════════════════════════════════════════════════════ -->
<main class="flex-1 flex items-start justify-center p-4 sm:p-6 pb-8">
  <div class="w-full max-w-md">

    <!-- ── Ikon & Teks Sukses ─────────────────────────────── -->
    <div class="text-center pt-6 pb-1">
      <!-- Ikon bulat besar dengan animasi scaleIn -->
      <div class="flex items-center justify-center mb-5">
        <div class="anim-scale-in w-24 h-24 sm:w-28 sm:h-28 bg-green-100 rounded-full
                    flex items-center justify-center
                    shadow-xl shadow-green-200/50 ring-8 ring-green-100/60">
          <div class="w-16 h-16 sm:w-20 sm:h-20 bg-green-500 rounded-full
                      flex items-center justify-center shadow-inner">
            <i class="fa-solid fa-check text-white text-3xl sm:text-4xl"
               aria-hidden="true"></i>
          </div>
        </div>
      </div>

      <!-- Judul — di-update JS untuk multi-election -->
      <h1 class="text-2xl sm:text-3xl font-extrabold text-gray-800 mb-2 leading-tight"
          id="success-title">
        Suara Anda Telah Tercatat!
      </h1>
      <!-- Subtitle — di-update JS untuk multi-election -->
      <p class="text-gray-500 text-sm leading-relaxed max-w-xs mx-auto"
         id="success-subtitle">
        Terima kasih telah berpartisipasi.<br class="hidden sm:block"/>
        Suara Anda sangat berarti bagi demokrasi sekolah.
      </p>
    </div>

    <!-- ── Kartu: Info Voter ───────────────────────────────── -->
    <div class="card mt-5 anim-slide-up anim-delay-1">
      <div class="card-body py-4">
        <div class="flex items-center gap-3">
          <!-- Avatar ikon -->
          <div class="w-10 h-10 bg-primary-100 rounded-full flex items-center justify-center
                      flex-shrink-0">
            <i class="fa-solid fa-user text-primary-600 text-sm" aria-hidden="true"></i>
          </div>
          <!-- Nama & kelas voter -->
          <div class="flex-1 min-w-0">
            <p class="text-sm font-semibold text-gray-800 truncate leading-tight"
               id="voter-display-name">—</p>
            <p class="text-xs text-gray-500 truncate leading-snug mt-0.5"
               id="voter-display-class"></p>
          </div>
          <!-- Badge -->
          <div class="flex-shrink-0">
            <span class="badge badge-success whitespace-nowrap">
              <i class="fa-solid fa-circle-check text-xs" aria-hidden="true"></i>
              Sudah Memilih
            </span>
          </div>
        </div>
      </div>
    </div>

    <!-- ══════════════════════════════════════════════════════
         MULTI-ELECTION: Ringkasan per election
         Tampil jika ada ≥ 2 elections dalam sesi.
    ════════════════════════════════════════════════════════ -->
    <div id="multi-vote-summary"
         class="card mt-3 hidden anim-slide-up anim-delay-2"
         role="region"
         aria-label="Ringkasan semua suara Anda">
      <div class="card-body py-4">
        <p class="card-section-label">
          <i class="fa-solid fa-list-check text-primary-400" aria-hidden="true"></i>
          Ringkasan Semua Suara
        </p>
        <!-- Diisi oleh renderMultiSummary() -->
        <div id="multi-vote-list" role="list"></div>
      </div>
    </div>

    <!-- ══════════════════════════════════════════════════════
         SINGLE-ELECTION: Detail suara satu election
         Tampil jika hanya 1 election DAN ev_vote_result tersedia.
    ════════════════════════════════════════════════════════ -->
    <div id="vote-info"
         class="card mt-3 hidden anim-slide-up anim-delay-2"
         role="region"
         aria-label="Detail suara Anda">
      <div class="card-body py-4">
        <p class="card-section-label">
          <i class="fa-solid fa-receipt text-gray-400" aria-hidden="true"></i>
          Detail Suara
        </p>
        <!-- FIX: gunakan div+class instead of dl agar layout lebih konsisten -->
        <div class="divide-y divide-gray-50">
          <div class="detail-row">
            <dt>Pilihan Anda</dt>
            <dd class="font-semibold text-gray-900" id="voted-candidate">—</dd>
          </div>
          <div class="detail-row">
            <dt>No. Urut</dt>
            <dd id="voted-order">—</dd>
          </div>
          <div class="detail-row">
            <dt>Waktu</dt>
            <dd id="voted-time">—</dd>
          </div>
          <div class="detail-row">
            <dt>ID Verifikasi</dt>
            <dd class="font-mono text-xs text-gray-400 break-all" id="voted-id">—</dd>
          </div>
        </div>
      </div>
    </div>

    <!-- ── Countdown auto-logout ─────────────────────────── -->
    <div class="mt-4 anim-slide-up anim-delay-3">
      <div class="flex items-center justify-center gap-2 text-xs text-gray-400">
        <!-- SVG ring countdown: circumference = 2π×8 ≈ 50.27 -->
        <div class="relative w-5 h-5 flex-shrink-0" aria-hidden="true">
          <svg class="w-5 h-5 -rotate-90" viewBox="0 0 20 20">
            <circle cx="10" cy="10" r="8" fill="none" stroke="#e5e7eb" stroke-width="2"/>
            <circle id="countdown-ring" cx="10" cy="10" r="8"
                    fill="none" stroke="#9ca3af" stroke-width="2"
                    stroke-dasharray="50.27" stroke-dashoffset="0"
                    class="countdown-ring"/>
          </svg>
        </div>
        <span id="auto-logout-text">
          Keluar otomatis dalam
          <strong id="auto-logout-countdown" class="tabular-nums text-gray-600">2:00</strong>
        </span>
      </div>
    </div>

    <!-- ── Tombol Lihat Hasil (kondisional, dari config) ──── -->
    <div id="result-link-box" class="hidden mt-5 anim-slide-up anim-delay-3">
      <a href="/results.html"
         class="btn btn-outline-primary w-full"
         aria-label="Lihat hasil pemilihan">
        <i class="fa-solid fa-chart-bar" aria-hidden="true"></i>
        Lihat Hasil Pemilihan
      </a>
    </div>

    <!-- ── Tombol Keluar Utama ─────────────────────────────── -->
    <div class="mt-3 safe-bottom anim-slide-up anim-delay-4">
      <button id="logout-btn-main"
              class="btn btn-secondary btn-lg w-full"
              aria-label="Selesai dan keluar dari sistem">
        <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
        Selesai &amp; Keluar
      </button>
    </div>

  </div><!-- /max-w-md -->
</main>

<script src="/assets/js/config.js"></script>
<script src="/assets/js/utils.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/auth.js"></script>
<script src="/assets/js/components.js"></script>
<script>
/* ============================================================
   success.html — Refactored & Multi-election support
   ============================================================ */

// Durasi auto-logout (ms)
const AUTO_LOGOUT_MS = 2 * 60 * 1000; // 2 menit

(async () => {

  // ── 1. Guard: harus login sebagai voter ─────────────────
  // Auth.requireVoter() cek token + isExpired(). Jika gagal → redirect /index.html.
  if (!Auth.requireVoter()) return;

  // ── 2. Config — satu request, gunakan cache ──────────────
  // FIX: sebelumnya ada dua request terpisah:
  //   - loadAppConfig() fire-and-forget (untuk app name / logo)
  //   - API.config.get() langsung (untuk ALLOW_PUBLIC_RESULT)
  // Keduanya bisa race di cold cache, dan yang kedua tidak memakai cache sama sekali.
  //
  // Solusi: await loadAppConfig() — ia mengembalikan data config (cache-first).
  // Return value dipakai untuk cek ALLOW_PUBLIC_RESULT sehingga tidak ada
  // request ganda ke GAS.
  let appConfig = {};
  try {
    appConfig = await loadAppConfig() || {};
  } catch (_) { /* loadAppConfig sudah handle error internal — abaikan */ }

  // ── 3. Isi data voter dari session ──────────────────────
  const voter = Auth.getUserData();
  if (voter) {
    document.getElementById('voter-display-name').textContent =
      voter.name || 'Pemilih';
    document.getElementById('voter-display-class').textContent =
      voter.className || '';
  }

  // ── 4. Mode: single atau multi-election ─────────────────
  const elections = Auth.getElectionsData();
  const isMulti   = elections.length > 1;

  if (isMulti) {
    renderMultiSummary(elections);
    // Update judul & subtitle untuk multi
    const titleEl    = document.getElementById('success-title');
    const subtitleEl = document.getElementById('success-subtitle');
    if (titleEl)    titleEl.textContent    = 'Semua Suara Telah Tercatat!';
    if (subtitleEl) subtitleEl.textContent =
      'Terima kasih telah berpartisipasi di ' + elections.length +
      ' pemilihan. Suara Anda sangat berarti bagi demokrasi sekolah.';
  } else {
    renderSingleVoteDetail();
  }

  // ── 5. Tampilkan tombol Lihat Hasil jika diizinkan ──────
  // FIX: gunakan appConfig dari step 2 — tidak ada request ganda ke GAS.
  const allowPublic = appConfig.ALLOW_PUBLIC_RESULT === 'true' ||
                      appConfig.ALLOW_PUBLIC_RESULT === true;
  if (allowPublic) {
    const resultBox = document.getElementById('result-link-box');
    if (resultBox) resultBox.classList.remove('hidden');
  }

  // ── 6. Confetti ──────────────────────────────────────────
  launchConfetti();

  // ── 7. Auto-logout countdown ─────────────────────────────
  const logoutTimer = startAutoLogoutCountdown(AUTO_LOGOUT_MS, () => {
    Auth.logoutVoter();
  });

  // ── 8. Event listeners tombol logout ─────────────────────
  // FIX: guard isLoggingOut agar double-click / auto-timer bersamaan
  // tidak memanggil logoutVoter() dua kali (double-logout → console error).
  let _isLoggingOut = false;
  const doLogout = () => {
    if (_isLoggingOut) return;
    _isLoggingOut = true;
    logoutTimer.cancel();
    Auth.logoutVoter();
  };
  document.getElementById('logout-btn-top').addEventListener('click', doLogout);
  document.getElementById('logout-btn-main').addEventListener('click', doLogout);

})();

/* ============================================================
   renderMultiSummary
   Tampilkan satu baris per election dengan status + kandidat.

   Sumber data:
   - elections: dari Auth.getElectionsData() (hasVoted, votedAt per election)
   - ev_vote_result: dari sessionStorage — hanya satu vote (terakhir disubmit).
     Dicocokkan ke election berdasarkan electionId untuk mendapatkan
     nama kandidat. Election lain tampil tanpa nama kandidat karena
     data tersebut memang tidak disimpan di frontend.
   ============================================================ */
function renderMultiSummary(elections) {
  const summaryBox  = document.getElementById('multi-vote-summary');
  const summaryList = document.getElementById('multi-vote-list');
  if (!summaryBox || !summaryList) return;

  // Baca ev_vote_result: data vote terakhir yang disubmit
  let lastVoteResult = null;
  try {
    const raw = sessionStorage.getItem('ev_vote_result');
    if (raw) lastVoteResult = JSON.parse(raw);
  } catch (_) { /* JSON rusak — abaikan */ }

  const itemsHtml = elections.map((el, idx) => {
    const elId     = String(el.id || el.electionId || '');
    const hasVoted = !!el.hasVoted;

    // Escape judul untuk innerHTML
    const elTitleSafe = Utils.escapeHtml(el.title || ('Pemilihan ' + (idx + 1)));

    // Nama kandidat: hanya tersedia jika election ini adalah yang terakhir disubmit
    let candidateLabelSafe = '';
    if (lastVoteResult && String(lastVoteResult.electionId) === elId) {
      const cName   = (lastVoteResult.candidateName || '').trim();
      const pName   = (lastVoteResult.pairName       || '').trim();
      const orderNo = lastVoteResult.orderNumber;
      if (cName) {
        const raw = 'No. ' + orderNo + ' — ' + cName + (pName ? ' & ' + pName : '');
        candidateLabelSafe = Utils.escapeHtml(raw);
      }
    }

    // Waktu vote: disimpan client-side oleh markElectionVoted()
    const votedAtSafe = el.votedAt
      ? Utils.escapeHtml(Utils.formatDateTime(el.votedAt))
      : '';

    if (hasVoted) {
      return `
        <div class="election-summary-item" role="listitem">
          <div class="w-8 h-8 bg-green-100 rounded-full flex items-center justify-center
                      flex-shrink-0 mt-0.5 check-bounce"
               style="animation-delay:${(idx * 0.1).toFixed(2)}s"
               aria-hidden="true">
            <i class="fa-solid fa-check text-green-600 text-xs"></i>
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-semibold text-gray-800 leading-tight truncate">
              ${elTitleSafe}
            </p>
            ${candidateLabelSafe
              ? `<p class="text-xs text-primary-600 font-medium mt-0.5 truncate">
                   ${candidateLabelSafe}
                 </p>`
              : ''}
            ${votedAtSafe
              ? `<p class="text-xs text-gray-400 mt-0.5">
                   <i class="fa-regular fa-clock mr-1" aria-hidden="true"></i>${votedAtSafe}
                 </p>`
              : ''}
          </div>
          <span class="badge badge-success flex-shrink-0 self-start mt-0.5 whitespace-nowrap">
            Tercatat
          </span>
        </div>`;
    }

    // Seharusnya tidak terjadi di halaman ini (guard sudah redirect jika belum semua voted),
    // tapi ditangani agar tidak ada konten kosong / crash.
    return `
      <div class="election-summary-item" role="listitem">
        <div class="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center
                    flex-shrink-0 mt-0.5" aria-hidden="true">
          <i class="fa-solid fa-clock text-gray-400 text-xs"></i>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-semibold text-gray-600 leading-tight truncate">
            ${elTitleSafe}
          </p>
          <p class="text-xs text-gray-400 mt-0.5">Belum tercatat</p>
        </div>
        <span class="badge badge-gray flex-shrink-0 self-start mt-0.5 whitespace-nowrap">
          Pending
        </span>
      </div>`;
  }).join('');

  summaryList.innerHTML = itemsHtml;
  summaryBox.classList.remove('hidden');
}

/* ============================================================
   renderSingleVoteDetail
   Tampilkan detail suara untuk sesi single-election.
   Sumber: ev_vote_result di sessionStorage.
   ============================================================ */
function renderSingleVoteDetail() {
  const voteInfoBox = document.getElementById('vote-info');
  if (!voteInfoBox) return;

  let vr = null;
  try {
    const raw = sessionStorage.getItem('ev_vote_result');
    if (raw) vr = JSON.parse(raw);
  } catch (_) { return; /* JSON rusak — silent */ }

  // Tampilkan hanya jika candidateName tersedia (data valid)
  if (!vr || !vr.candidateName) return;

  const fullName = vr.candidateName.trim() +
    (vr.pairName && vr.pairName.trim() ? ' & ' + vr.pairName.trim() : '');

  // FIX: gunakan textContent — tidak ada innerHTML di sini agar aman dari XSS
  const setField = (id, text) => {
    const el = document.getElementById(id);
    if (el) el.textContent = text || '—';
  };

  setField('voted-candidate', fullName);
  setField('voted-order',     vr.orderNumber ? 'No. ' + vr.orderNumber : '—');
  setField('voted-time',      vr.timestamp   ? Utils.formatDateTime(vr.timestamp) : '—');
  setField('voted-id',        vr.voteId      || '—');

  voteInfoBox.classList.remove('hidden');
}

/* ============================================================
   launchConfetti
   Animasi confetti saat halaman pertama dimuat.
   Cleanup otomatis setelah animasi selesai.
   ============================================================ */
function launchConfetti() {
  const container = document.getElementById('confetti-container');
  if (!container) return;

  const colors = ['#3b82f6','#22c55e','#f59e0b','#ef4444','#8b5cf6','#06b6d4'];

  for (let i = 0; i < 55; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    const size = 6 + Math.random() * 8;
    piece.style.cssText = [
      'left:'              + (Math.random() * 100) + 'vw',
      'top:-20px',
      'background:'        + colors[Math.floor(Math.random() * colors.length)],
      'border-radius:'     + (Math.random() > 0.5 ? '50%' : '3px'),
      'width:'             + size + 'px',
      'height:'            + size + 'px',
      'animation-duration:'+ (1.5 + Math.random() * 2) + 's',
      'animation-delay:'   + (Math.random() * 0.8)     + 's',
      'transform:rotate('  + (Math.random() * 360)     + 'deg)',
    ].join(';');
    container.appendChild(piece);
  }

  // Bersihkan DOM setelah animasi selesai (maksimal ~3.3 detik)
  const cleanupTimer = setTimeout(() => { container.innerHTML = ''; }, 4000);

  // Cleanup tambahan saat tab tidak aktif / navigasi
  document.addEventListener('visibilitychange', function _onVisChange() {
    if (document.hidden) {
      clearTimeout(cleanupTimer);
      container.innerHTML = '';
      document.removeEventListener('visibilitychange', _onVisChange);
    }
  });
}

/* ============================================================
   startAutoLogoutCountdown
   Countdown visual dengan SVG ring yang mengosong dari penuh ke kosong.
   Mengembalikan objek { cancel() } agar timer bisa dihentikan saat
   user menekan logout manual — mencegah double-logout.

   FIX: warna ring berubah ke amber (<30 dtk) dan merah (<10 dtk).
   FIX: teks countdown juga punya kelas urgent-pulse saat kritis.
   ============================================================ */
function startAutoLogoutCountdown(durationMs, onExpire) {
  const countdownEl = document.getElementById('auto-logout-countdown');
  const ringEl      = document.getElementById('countdown-ring');

  // SVG: r=8 → circumference = 2π×8 ≈ 50.265
  const CIRCUMFERENCE = 50.265;

  let remaining = durationMs;
  let cancelled = false;

  // Render tick awal segera (tidak menunggu 1 detik pertama)
  function render() {
    if (countdownEl) {
      const mins = Math.floor(remaining / 60000);
      const secs = Math.floor((remaining % 60000) / 1000);
      countdownEl.textContent = mins + ':' + String(secs).padStart(2, '0');

      // Warna & animasi berdasarkan urgensi
      if (remaining <= 10000) {
        countdownEl.classList.add('urgent-pulse');
        countdownEl.style.color = '#ef4444'; // red-500
      } else if (remaining <= 30000) {
        countdownEl.classList.remove('urgent-pulse');
        countdownEl.style.color = '#f59e0b'; // amber-500
      } else {
        countdownEl.classList.remove('urgent-pulse');
        countdownEl.style.color = '';
      }
    }

    if (ringEl) {
      // offset 0 = ring penuh, offset = CIRCUMFERENCE = ring kosong
      const progress = Math.max(0, remaining / durationMs);
      const offset   = CIRCUMFERENCE * (1 - progress);
      ringEl.style.strokeDashoffset = String(offset);

      // Sinkronkan warna ring dengan teks
      if      (remaining <= 10000) ringEl.style.stroke = '#ef4444';
      else if (remaining <= 30000) ringEl.style.stroke = '#f59e0b';
      else                         ringEl.style.stroke = '#9ca3af'; // kembali ke default
    }
  }

  render(); // tampilkan kondisi awal sebelum tick pertama

  const interval = setInterval(() => {
    if (cancelled) { clearInterval(interval); return; }
    remaining -= 1000;
    render();
    if (remaining <= 0) {
      clearInterval(interval);
      if (!cancelled) onExpire();
    }
  }, 1000);

  return {
    cancel() {
      cancelled = true;
      clearInterval(interval);
    },
  };
}
</script>
</body>
</html>
