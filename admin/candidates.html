<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manajemen Kandidat — eVoting OSIM Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <link rel="stylesheet" href="../assets/css/tailwind.css"/>
</head>
<body class="h-full bg-gray-50 flex">
<div id="toast-container"></div>
<div id="sidebar-overlay" class="fixed inset-0 bg-black/40 z-30 hidden lg:hidden"></div>

<aside id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-white border-r border-gray-200 z-40 flex flex-col transition-transform duration-300 -translate-x-full lg:translate-x-0 lg:static lg:z-auto">
  <div class="px-5 py-4 border-b border-gray-100">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 bg-primary-600 rounded-xl flex items-center justify-center flex-shrink-0"><i class="fa-solid fa-box-ballot text-white"></i></div>
      <div class="min-w-0">
        <p class="text-sm font-bold text-gray-800 truncate" id="sidebar-app-name">eVoting OSIM</p>
        <p class="text-xs text-gray-500 truncate" id="sidebar-school-name"></p>
      </div>
    </div>
  </div>
  <nav class="flex-1 p-3 space-y-0.5 overflow-y-auto">
    <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider px-3 pt-2 pb-1">Menu Utama</p>
    <a href="./dashboard.html"  class="sidebar-link"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
    <a href="./election.html"   class="sidebar-link"><i class="fa-solid fa-calendar-check"></i> Manajemen Pemilihan</a>
    <a href="./candidates.html" class="sidebar-link"><i class="fa-solid fa-users"></i> Kandidat</a>
    <a href="./voters.html"     class="sidebar-link"><i class="fa-solid fa-id-card"></i> Pemilih</a>
    <a href="./results.html"    class="sidebar-link"><i class="fa-solid fa-chart-bar"></i> Hasil Pemilihan</a>
    <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider px-3 pt-4 pb-1">Pengaturan</p>
    <a href="./settings.html"   class="sidebar-link"><i class="fa-solid fa-gear"></i> Pengaturan Aplikasi</a>
  </nav>
  <div class="p-3 border-t border-gray-100">
    <div class="flex items-center gap-3 px-2 py-2 rounded-lg">
      <div class="w-8 h-8 bg-primary-100 rounded-full flex items-center justify-center flex-shrink-0"><i class="fa-solid fa-user text-primary-600 text-sm"></i></div>
      <div class="flex-1 min-w-0">
        <p class="text-xs font-semibold text-gray-800 truncate" id="topbar-user-name"></p>
        <p class="text-xs text-gray-500" id="topbar-user-role"></p>
      </div>
      <button id="topbar-logout-btn" class="text-gray-400 hover:text-red-500 transition-colors p-1"><i class="fa-solid fa-right-from-bracket text-sm"></i></button>
    </div>
  </div>
</aside>

<div class="flex-1 flex flex-col min-w-0">
  <header class="bg-white border-b border-gray-200 px-4 h-14 flex items-center gap-4 sticky top-0 z-20">
    <button id="sidebar-toggle" class="lg:hidden text-gray-500 hover:text-gray-700 p-1"><i class="fa-solid fa-bars text-lg"></i></button>
    <h1 class="text-base font-semibold text-gray-800 flex-1">Manajemen Kandidat</h1>
    <button id="btn-add" class="btn btn-primary text-sm">
      <i class="fa-solid fa-plus"></i> Tambah Kandidat
    </button>
  </header>

  <main class="flex-1 p-4 md:p-6 overflow-auto">
    <!-- Election selector -->
    <div class="card p-4 mb-5">
      <div class="flex flex-col sm:flex-row sm:items-center gap-3">
        <label class="form-label mb-0 flex-shrink-0">Pemilihan:</label>
        <select id="election-select" class="form-select flex-1 max-w-sm">
          <option value="">— Pilih Pemilihan —</option>
        </select>
        <p class="text-xs text-gray-400">Pilih pemilihan untuk mengelola kandidatnya.</p>
      </div>
    </div>

    <div id="loading-state" class="text-center py-16 hidden">
      <div class="inline-block w-8 h-8 border-4 border-primary-200 border-t-primary-600 rounded-full animate-spin mb-3"></div>
      <p class="text-gray-500 text-sm">Memuat kandidat...</p>
    </div>

    <div id="empty-state" class="hidden">
      <div class="empty-state">
        <i class="fa-solid fa-users-slash"></i>
        <h3 class="text-base font-semibold text-gray-600">Belum ada kandidat</h3>
        <p id="empty-text">Pilih pemilihan terlebih dahulu atau tambah kandidat.</p>
        <button id="btn-add-empty" class="btn btn-primary mt-4"><i class="fa-solid fa-plus"></i> Tambah Kandidat</button>
      </div>
    </div>

    <div id="content-state" class="hidden">
      <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4" id="candidates-grid"></div>
    </div>
  </main>
</div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/utils.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/components.js"></script>
<script>
let _elections   = [];
let _candidates  = [];
let _electionId  = '';
let _uploadingFor = null; // 'main' | 'pair'

(async () => {
  if (!Auth.requireAdminPage()) return;
  Sidebar.init(); Topbar.init();

  document.getElementById('btn-add').addEventListener('click', () => openCandidateModal());
  document.getElementById('btn-add-empty')?.addEventListener('click', () => openCandidateModal());
  document.getElementById('election-select').addEventListener('change', e => {
    _electionId = e.target.value;
    if (_electionId) loadCandidates();
    else showState('empty', 'Pilih pemilihan untuk melihat kandidat.');
  });

  await loadElectionOptions();
})();

async function loadElectionOptions() {
  const res = await API.election.getAll();
  if (!res.success) return;
  _elections = res.data || [];
  const sel = document.getElementById('election-select');
  sel.innerHTML = '<option value="">— Pilih Pemilihan —</option>' +
    _elections.map(e => `<option value="${e.id}">${Utils.escapeHtml(e.title)}</option>`).join('');
  // Auto-select jika hanya satu
  if (_elections.length === 1) {
    sel.value = _elections[0].id;
    _electionId = _elections[0].id;
    loadCandidates();
  } else {
    showState('empty', 'Pilih pemilihan untuk melihat kandidat.');
  }
}

async function loadCandidates() {
  if (!_electionId) return;
  showState('loading');
  const res = await API.candidate.getAll(_electionId);
  if (!res.success) { Toast.error(res.message); showState('empty'); return; }
  _candidates = res.data || [];
  if (!_candidates.length) { showState('empty', 'Belum ada kandidat. Klik "Tambah Kandidat" untuk menambah.'); return; }
  renderCandidates();
  showState('content');
}

function renderCandidates() {
  document.getElementById('candidates-grid').innerHTML = _candidates.map(c => `
    <div class="card overflow-hidden">
      <div class="grid grid-cols-2 gap-0">
        <div class="relative bg-gray-100">
          ${c.photoUrl
            ? `<img src="${Utils.escapeHtml(c.photoUrl)}" class="w-full h-36 object-cover object-top" loading="lazy" onerror="this.src='/assets/img/no-photo.png'">`
            : `<div class="w-full h-36 flex items-center justify-center bg-gray-100"><i class="fa-solid fa-user text-4xl text-gray-300"></i></div>`}
          <span class="absolute top-2 left-2 bg-black/60 text-white text-xs px-2 py-0.5 rounded-full font-bold">No.${c.orderNumber}</span>
        </div>
        <div class="relative bg-gray-50">
          ${c.pairPhotoUrl
            ? `<img src="${Utils.escapeHtml(c.pairPhotoUrl)}" class="w-full h-36 object-cover object-top" loading="lazy" onerror="this.src='/assets/img/no-photo.png'">`
            : `<div class="w-full h-36 flex items-center justify-center bg-gray-100"><i class="fa-solid fa-user text-4xl text-gray-300"></i></div>`}
        </div>
      </div>
      <div class="p-4">
        <div class="flex items-start justify-between gap-2 mb-2">
          <div class="min-w-0">
            <p class="text-sm font-bold text-gray-800 truncate">${Utils.escapeHtml(c.name)}</p>
            <p class="text-xs text-gray-500">Ketua · ${Utils.escapeHtml(c.className||'-')}</p>
            <p class="text-sm font-semibold text-gray-700 truncate mt-1">${Utils.escapeHtml(c.pairName||'—')}</p>
            <p class="text-xs text-gray-500">Wakil · ${Utils.escapeHtml(c.pairClassName||'-')}</p>
          </div>
          <span class="badge ${c.isActive ? 'badge-success' : 'badge-gray'} flex-shrink-0">${c.isActive ? 'Aktif' : 'Nonaktif'}</span>
        </div>
        ${c.vision ? `<p class="text-xs text-gray-500 line-clamp-2 mb-3">${Utils.escapeHtml(c.vision)}</p>` : ''}
        <div class="flex gap-2">
          <button class="btn btn-sm btn-outline flex-1" onclick="openCandidateModal('${c.id}')">
            <i class="fa-solid fa-pen-to-square"></i> Edit
          </button>
          <button class="btn btn-sm btn-danger" onclick="confirmDeleteCandidate('${c.id}')">
            <i class="fa-solid fa-trash"></i>
          </button>
        </div>
      </div>
    </div>`).join('');
}

// ── Candidate Modal ──────────────────────────────────────────

function candidateFormHtml(data = {}) {
  return `
    <div class="space-y-4">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <!-- Ketua -->
        <div class="space-y-3 p-3 bg-blue-50 rounded-xl">
          <p class="text-xs font-bold text-blue-700 uppercase tracking-wide"><i class="fa-solid fa-crown mr-1"></i>Calon Ketua</p>
          <div>
            <label class="form-label text-xs">Nama Lengkap <span class="text-red-500">*</span></label>
            <input type="text" id="f-name" class="form-input" value="${Utils.escapeHtml(data.name||'')}" placeholder="Nama ketua"/>
          </div>
          <div>
            <label class="form-label text-xs">Kelas</label>
            <input type="text" id="f-class" class="form-input" value="${Utils.escapeHtml(data.className||'')}" placeholder="XII IPA 1"/>
          </div>
          <div>
            <label class="form-label text-xs">Foto Ketua</label>
            <div class="flex items-center gap-3">
              <div id="preview-main" class="w-16 h-16 rounded-lg overflow-hidden bg-gray-200 flex-shrink-0 flex items-center justify-center">
                ${data.photoUrl ? `<img src="${Utils.escapeHtml(data.photoUrl)}" class="w-full h-full object-cover">` : '<i class="fa-solid fa-user text-gray-400"></i>'}
              </div>
              <label class="btn btn-sm btn-outline cursor-pointer">
                <i class="fa-solid fa-upload"></i> Upload
                <input type="file" id="f-photo" accept="image/jpeg,image/jpg,image/png,image/webp" class="hidden" onchange="previewAndUpload('main', this)"/>
              </label>
            </div>
            <input type="hidden" id="f-photo-url" value="${Utils.escapeHtml(data.photoUrl||'')}"/>
          </div>
        </div>

        <!-- Wakil -->
        <div class="space-y-3 p-3 bg-green-50 rounded-xl">
          <p class="text-xs font-bold text-green-700 uppercase tracking-wide"><i class="fa-solid fa-star mr-1"></i>Calon Wakil</p>
          <div>
            <label class="form-label text-xs">Nama Lengkap</label>
            <input type="text" id="f-pair-name" class="form-input" value="${Utils.escapeHtml(data.pairName||'')}" placeholder="Nama wakil"/>
          </div>
          <div>
            <label class="form-label text-xs">Kelas</label>
            <input type="text" id="f-pair-class" class="form-input" value="${Utils.escapeHtml(data.pairClassName||'')}" placeholder="XI IPS 2"/>
          </div>
          <div>
            <label class="form-label text-xs">Foto Wakil</label>
            <div class="flex items-center gap-3">
              <div id="preview-pair" class="w-16 h-16 rounded-lg overflow-hidden bg-gray-200 flex-shrink-0 flex items-center justify-center">
                ${data.pairPhotoUrl ? `<img src="${Utils.escapeHtml(data.pairPhotoUrl)}" class="w-full h-full object-cover">` : '<i class="fa-solid fa-user text-gray-400"></i>'}
              </div>
              <label class="btn btn-sm btn-outline cursor-pointer">
                <i class="fa-solid fa-upload"></i> Upload
                <input type="file" id="f-pair-photo" accept="image/jpeg,image/jpg,image/png,image/webp" class="hidden" onchange="previewAndUpload('pair', this)"/>
              </label>
            </div>
            <input type="hidden" id="f-pair-photo-url" value="${Utils.escapeHtml(data.pairPhotoUrl||'')}"/>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div class="form-group mb-0">
          <label class="form-label text-xs">No. Urut</label>
          <input type="number" id="f-order" class="form-input" value="${data.orderNumber||''}" min="1" placeholder="Otomatis"/>
        </div>
        <div class="form-group mb-0 flex items-end pb-1">
          <label class="flex items-center gap-2 cursor-pointer select-none text-sm">
            <input type="checkbox" id="f-active" class="w-4 h-4 accent-primary-600" ${data.isActive !== false ? 'checked':''}/>
            Tampilkan ke Pemilih
          </label>
        </div>
      </div>

      <div class="form-group mb-0">
        <label class="form-label text-xs">Visi</label>
        <textarea id="f-vision" class="form-textarea" rows="2" placeholder="Visi kandidat...">${Utils.escapeHtml(data.vision||'')}</textarea>
      </div>
      <div class="form-group mb-0">
        <label class="form-label text-xs">Misi <span class="text-gray-400 font-normal">(satu per baris)</span></label>
        <textarea id="f-mission" class="form-textarea" rows="3" placeholder="Misi 1&#10;Misi 2&#10;Misi 3">${Utils.escapeHtml(data.mission||'')}</textarea>
      </div>
      <div class="form-group mb-0">
        <label class="form-label text-xs">Program Kerja <span class="text-gray-400 font-normal">(satu per baris)</span></label>
        <textarea id="f-programs" class="form-textarea" rows="3" placeholder="Program 1&#10;Program 2">${Utils.escapeHtml(data.programs||'')}</textarea>
      </div>
      <div class="form-group mb-0">
        <label class="form-label text-xs">Informasi Tambahan</label>
        <textarea id="f-info" class="form-textarea" rows="2" placeholder="Info tambahan...">${Utils.escapeHtml(data.additionalInfo||'')}</textarea>
      </div>
    </div>`;
}

function openCandidateModal(id) {
  if (!_electionId) { Toast.warning('Pilih pemilihan terlebih dahulu.'); return; }
  const data = id ? _candidates.find(c => c.id === id) : {};
  const modal = Modal.open({
    id: 'modal-candidate',
    title: id ? 'Edit Kandidat' : 'Tambah Kandidat Baru',
    body: candidateFormHtml(data || {}),
    size: 'xl',
    actions: [
      { label: 'Batal', class: 'btn-secondary', action: 'cancel' },
      { label: id ? 'Simpan Perubahan' : 'Tambah Kandidat', class: 'btn-primary', action: 'save', id: 'modal-save-btn' },
    ],
  });
  modal.querySelectorAll('[data-action]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (btn.dataset.action === 'cancel') { Modal.close(); return; }
      await saveCandidate(id || null, btn);
    });
  });
}

async function previewAndUpload(type, input) {
  const file = input.files[0];
  if (!file) return;
  const validation = Utils.validateImageFile(file);
  if (!validation.valid) { Toast.error(validation.error); input.value = ''; return; }

  const previewId = type === 'main' ? 'preview-main' : 'preview-pair';
  const urlId     = type === 'main' ? 'f-photo-url'  : 'f-pair-photo-url';
  const preview   = document.getElementById(previewId);

  // Show local preview immediately
  const localUrl = URL.createObjectURL(file);
  preview.innerHTML = `<img src="${localUrl}" class="w-full h-full object-cover">`;
  preview.insertAdjacentHTML('afterbegin', '<div class="absolute inset-0 bg-black/30 flex items-center justify-center"><div class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div></div>');

  try {
    const base64   = await Utils.readFileAsBase64(file);
    const oldUrl   = document.getElementById(urlId)?.value || '';
    const res      = await API.candidate.uploadPhoto({ filename: file.name, mimeType: file.type, base64, oldUrl });

    preview.innerHTML = `<img src="${localUrl}" class="w-full h-full object-cover">`;
    if (res.success) {
      document.getElementById(urlId).value = res.data.url;
      Toast.success('Foto berhasil diupload.');
    } else {
      Toast.error(res.message || 'Gagal upload foto.');
      preview.innerHTML = '<i class="fa-solid fa-user text-gray-400"></i>';
    }
  } catch {
    preview.innerHTML = '<i class="fa-solid fa-user text-gray-400"></i>';
    Toast.error('Gagal mengupload foto.');
  }
}

async function saveCandidate(id, btn) {
  const name = document.getElementById('f-name')?.value.trim();
  if (!name) { Toast.warning('Nama calon ketua wajib diisi.'); return; }

  Utils.setLoading(btn, true, 'Menyimpan...');
  const payload = {
    electionId:    _electionId,
    orderNumber:   parseInt(document.getElementById('f-order')?.value) || 0,
    name,
    photoUrl:      document.getElementById('f-photo-url')?.value || '',
    className:     document.getElementById('f-class')?.value.trim() || '',
    pairName:      document.getElementById('f-pair-name')?.value.trim() || '',
    pairPhotoUrl:  document.getElementById('f-pair-photo-url')?.value || '',
    pairClassName: document.getElementById('f-pair-class')?.value.trim() || '',
    vision:        document.getElementById('f-vision')?.value.trim() || '',
    mission:       document.getElementById('f-mission')?.value.trim() || '',
    programs:      document.getElementById('f-programs')?.value.trim() || '',
    additionalInfo:document.getElementById('f-info')?.value.trim() || '',
    isActive:      document.getElementById('f-active')?.checked !== false,
  };
  if (id) payload.id = id;

  const res = id ? await API.candidate.update(payload) : await API.candidate.create(payload);
  Utils.setLoading(btn, false);

  if (res.success) {
    Toast.success(id ? 'Kandidat berhasil diperbarui.' : 'Kandidat berhasil ditambahkan.');
    Modal.close(); loadCandidates();
  } else {
    Toast.error(res.message);
  }
}

async function confirmDeleteCandidate(id) {
  const c = _candidates.find(x => x.id === id);
  if (!c) return;
  const ok = await Utils.confirm(`Hapus kandidat "${c.name}"?`, 'Konfirmasi Hapus', true);
  if (!ok) return;
  const res = await API.candidate.delete(id);
  if (res.success) { Toast.success('Kandidat berhasil dihapus.'); loadCandidates(); }
  else Toast.error(res.message);
}

function showState(s, emptyMsg) {
  document.getElementById('loading-state').classList.toggle('hidden', s !== 'loading');
  document.getElementById('content-state').classList.toggle('hidden', s !== 'content');
  document.getElementById('empty-state').classList.toggle('hidden', s !== 'empty');
  if (emptyMsg) {
    const el = document.getElementById('empty-text');
    if (el) el.textContent = emptyMsg;
  }
}
</script>
</body>
</html>
