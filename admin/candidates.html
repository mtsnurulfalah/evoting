<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
  <meta charset="UTF-8"/>
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="referrer" content="no-referrer"/>
  <title>Manajemen Kandidat — eVoting OSIM Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <link rel="stylesheet" href="../assets/css/tailwind.css"/>
  <style>
    /* ── Candidate Photo Area ── */
    .candidate-photo-col {
      position: relative;
      background: #f3f4f6;
      overflow: hidden;
    }
    .candidate-photo-col img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }
    .candidate-photo-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Upload overlay ── */
    .upload-spinner-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    /* ── Candidate card ── */
    .cand-card {
      background: #fff;
      border-radius: 14px;
      border: 1.5px solid #e5e7eb;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
      overflow: hidden;
      transition: box-shadow 0.2s, border-color 0.2s;
      display: flex;
      flex-direction: column;
    }
    .cand-card:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      border-color: #d1d5db;
    }
    .cand-card.card-inactive {
      opacity: 0.72;
    }

    /* ── Photo strip ── */
    .cand-photo-strip {
      display: grid;
      grid-template-columns: 1fr 1fr;
      height: 140px;
      flex-shrink: 0;
    }
    .cand-photo-strip .divider-line {
      position: absolute;
      top: 0; bottom: 0;
      left: 50%;
      width: 2px;
      background: #fff;
      z-index: 1;
    }
    @media (max-width: 360px) {
      .cand-photo-strip { height: 120px; }
    }

    /* ── Number badge ── */
    .order-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(0,0,0,0.62);
      backdrop-filter: blur(4px);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
      letter-spacing: 0.02em;
      z-index: 3;
      line-height: 1.6;
    }

    /* ── Role label on photo ── */
    .role-label {
      position: absolute;
      bottom: 0;
      left: 0; right: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.6) 0%, transparent 100%);
      color: #fff;
      font-size: 9px;
      font-weight: 600;
      text-align: center;
      padding: 12px 4px 5px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      z-index: 2;
    }

    /* ── Preview thumb in form ── */
    .photo-thumb {
      width: 64px;
      height: 64px;
      border-radius: 8px;
      overflow: hidden;
      background: #e5e7eb;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      border: 2px solid #e5e7eb;
    }
    .photo-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
    }
    .photo-thumb-spinner {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Form section label ── */
    .form-section-label {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .section-ketua  { background: #eff6ff; color: #1d4ed8; }
    .section-wakil  { background: #f0fdf4; color: #15803d; }
    .section-detail { background: #f9fafb; color: #4b5563; }

    /* ── Election selector card ── */
    .election-selector-card {
      background: #fff;
      border: 1.5px solid #e5e7eb;
      border-radius: 12px;
      padding: 14px 16px;
    }

    /* ── Skeleton ── */
    .sk { background: #e5e7eb; border-radius: 6px; animation: skpulse 1.5s ease-in-out infinite; }
    @keyframes skpulse { 0%,100%{opacity:1} 50%{opacity:.45} }

    /* ── Mobile modal bottom sheet ── */
    @media (max-width: 640px) {
      .modal-backdrop { align-items: flex-end; padding: 0; }
      .modal-box { border-radius: 20px 20px 0 0; max-height: 92dvh; max-height: 92vh; }
    }

    /* ── Field error inline ── */
    .field-error { font-size: 11px; color: #ef4444; margin-top: 3px; display: flex; align-items: center; gap: 4px; }
    .field-error:empty { display: none; }

    /* ── State illustration ── */
    .state-icon-wrap {
      width: 64px; height: 64px; border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px; font-size: 28px;
    }

    /* ── Count chip ── */
    .count-chip {
      display: inline-flex; align-items: center; gap: 4px;
      background: #f3f4f6; border-radius: 20px;
      padding: 2px 10px; font-size: 11px; font-weight: 600; color: #6b7280;
    }

    /* ── Upload progress indicator ── */
    .upload-status-dot {
      display: inline-block;
      width: 6px; height: 6px; border-radius: 50%;
      margin-right: 4px;
    }
    .upload-ok   { background: #16a34a; }
    .upload-fail { background: #ef4444; }
    .upload-none { background: #d1d5db; }
  </style>
</head>
<body class="h-full bg-gray-50 flex">

<div id="toast-container"></div>
<div id="sidebar-overlay" class="fixed inset-0 bg-black/40 z-30 hidden lg:hidden"></div>

<!-- ═══════════════════════════════════════════
     SIDEBAR
════════════════════════════════════════════ -->
<aside id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-white border-r border-gray-200 z-40 flex flex-col transition-transform duration-300 -translate-x-full lg:translate-x-0 lg:static lg:z-auto">
  <div class="px-5 py-4 border-b border-gray-100">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 bg-primary-600 rounded-xl flex items-center justify-center flex-shrink-0 overflow-hidden"
           data-school-logo>
        <i class="fa-solid fa-box-ballot text-white text-sm"></i>
      </div>
      <div class="min-w-0">
        <p class="text-sm font-bold text-gray-800 truncate" id="sidebar-app-name">eVoting OSIM</p>
        <p class="text-xs text-gray-500 truncate" id="sidebar-school-name"></p>
      </div>
    </div>
  </div>
  <nav class="flex-1 p-3 space-y-0.5 overflow-y-auto"></nav>
  <div class="p-3 border-t border-gray-100">
    <div class="flex items-center gap-3 px-2 py-2 rounded-lg">
      <div id="topbar-user-avatar" class="w-8 h-8 rounded-full overflow-hidden flex-shrink-0 bg-primary-100 flex items-center justify-center"></div>
      <div class="flex-1 min-w-0">
        <p class="text-xs font-semibold text-gray-800 truncate" id="topbar-user-name"></p>
        <p class="text-xs text-gray-500" id="topbar-user-role"></p>
      </div>
      <button id="topbar-logout-btn" class="text-gray-400 hover:text-red-500 transition-colors p-1.5 rounded" title="Logout">
        <i class="fa-solid fa-right-from-bracket text-sm"></i>
      </button>
    </div>
  </div>
</aside>

<!-- ═══════════════════════════════════════════
     MAIN CONTENT
════════════════════════════════════════════ -->
<div class="flex-1 flex flex-col min-w-0 overflow-hidden">

  <!-- ── Header ── -->
  <header class="bg-white border-b border-gray-200 px-4 h-14 flex items-center gap-3 sticky top-0 z-20 flex-shrink-0">
    <button id="sidebar-toggle" class="lg:hidden text-gray-500 hover:text-gray-700 p-1.5 rounded-lg hover:bg-gray-100 flex-shrink-0 transition-colors">
      <i class="fa-solid fa-bars text-base"></i>
    </button>
    <div class="flex-1 min-w-0">
      <h1 class="text-sm font-bold text-gray-800 truncate">Manajemen Kandidat</h1>
    </div>
    <button id="btn-add" class="btn btn-primary btn-sm flex-shrink-0 gap-1.5" title="Tambah Kandidat Baru">
      <i class="fa-solid fa-plus text-xs"></i>
      <span class="hidden xs:inline">Tambah Kandidat</span>
      <span class="xs:hidden">Tambah</span>
    </button>
  </header>

  <!-- ── Main ── -->
  <main class="flex-1 overflow-y-auto overflow-x-hidden">
    <div class="px-4 md:px-6 py-5 max-w-6xl mx-auto space-y-5">

      <!-- ── Election selector ── -->
      <div class="election-selector-card">
        <div class="flex flex-col sm:flex-row sm:items-center gap-3">
          <div class="flex items-center gap-2 flex-shrink-0">
            <i class="fa-solid fa-calendar-check text-primary-500 text-sm w-4 text-center"></i>
            <label class="text-sm font-semibold text-gray-700 whitespace-nowrap" for="election-select">Pemilihan</label>
          </div>
          <div class="flex-1 max-w-md relative">
            <select id="election-select" class="form-select w-full pr-8 text-sm">
              <option value="">— Memuat data pemilihan... —</option>
            </select>
          </div>
          <div id="election-meta" class="hidden flex items-center gap-2 flex-shrink-0">
            <!-- diisi JS -->
          </div>
        </div>
      </div>

      <!-- ── Toolbar (info + actions) ── -->
      <div id="toolbar" class="hidden flex items-center justify-between gap-3 flex-wrap">
        <div class="flex items-center gap-3">
          <span class="count-chip" id="candidate-count-chip">
            <i class="fa-solid fa-users text-gray-400 text-xs"></i>
            <span id="candidate-count">0</span> kandidat
          </span>
        </div>
      </div>

      <!-- ── Loading skeleton ── -->
      <div id="loading-state" class="hidden">
        <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4">
          <div class="cand-card">
            <div class="sk" style="height:140px;border-radius:0"></div>
            <div class="p-4 space-y-2">
              <div class="sk h-4 w-3/4 rounded"></div>
              <div class="sk h-3 w-1/2 rounded"></div>
              <div class="sk h-3 w-2/3 rounded mt-3"></div>
              <div class="sk h-3 w-1/2 rounded"></div>
            </div>
          </div>
          <div class="cand-card" style="opacity:.7">
            <div class="sk" style="height:140px;border-radius:0"></div>
            <div class="p-4 space-y-2">
              <div class="sk h-4 w-2/3 rounded"></div>
              <div class="sk h-3 w-1/3 rounded"></div>
            </div>
          </div>
          <div class="cand-card hidden xl:block" style="opacity:.4">
            <div class="sk" style="height:140px;border-radius:0"></div>
            <div class="p-4 space-y-2">
              <div class="sk h-4 w-1/2 rounded"></div>
              <div class="sk h-3 w-2/5 rounded"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- ── Content: grid kandidat ── -->
      <div id="content-state" class="hidden">
        <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4" id="candidates-grid"></div>
      </div>

      <!-- ── Empty state ── -->
      <div id="empty-state" class="hidden py-16 text-center">
        <div class="state-icon-wrap bg-gray-100 text-gray-400 mx-auto" id="empty-icon-wrap">
          <i class="fa-solid fa-users-slash" id="empty-icon"></i>
        </div>
        <h3 class="text-base font-semibold text-gray-700 mb-1" id="empty-title">Pilih pemilihan</h3>
        <p class="text-sm text-gray-400 max-w-xs mx-auto" id="empty-text">
          Pilih pemilihan terlebih dahulu untuk melihat kandidatnya.
        </p>
        <button id="btn-add-empty" class="btn btn-primary mt-5 gap-2 hidden">
          <i class="fa-solid fa-plus text-xs"></i> Tambah Kandidat
        </button>
      </div>

      <!-- ── Error state ── -->
      <div id="error-state" class="hidden py-16 text-center">
        <div class="state-icon-wrap bg-red-50 text-red-400 mx-auto">
          <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <h3 class="text-base font-semibold text-gray-700 mb-1">Gagal memuat kandidat</h3>
        <p class="text-sm text-gray-400 max-w-xs mx-auto" id="error-msg">Terjadi kesalahan.</p>
        <button id="btn-retry" class="btn btn-secondary mt-5 gap-2">
          <i class="fa-solid fa-rotate-right text-xs"></i> Coba Lagi
        </button>
      </div>

    </div>
  </main>
</div>

<!-- ─────────────────────────────────────────────
     SCRIPTS
──────────────────────────────────────────────── -->
<script src="../assets/js/config.js"></script>
<script src="../assets/js/utils.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/components.js"></script>
<script>
/* ============================================================
   candidates.js — Manajemen Kandidat (refactored)
   ============================================================ */

// ── State ────────────────────────────────────────────────────
let _elections      = [];
let _candidates     = [];
let _electionId     = '';
let _isSubmitting   = false;   // guard double-submit
let _isLoading      = false;   // guard race condition loadCandidates
let _uploadState    = {        // status upload per slot
  main: 'none',  // 'none' | 'uploading' | 'done' | 'error'
  pair: 'none',
};
// AbortController aktif per slot — dipakai untuk cancel XHR saat modal ditutup
let _uploadAbort = { main: null, pair: null };

// ── Init ─────────────────────────────────────────────────────
(async () => {
  // Panitia tidak boleh mengakses halaman ini — redirect ke dashboard.
  // Viewer boleh masuk tapi dalam mode readonly (tombol aksi disembunyikan).
  if (!Auth.requireAdminPage(['superadmin', 'admin', 'ketua_panitia', 'viewer'])) return;
  Sidebar.init();
  Topbar.init();

  const role     = Auth.getAdminRole();
  const canWrite = (role === 'superadmin' || role === 'admin' || role === 'ketua_panitia');

  // Sembunyikan tombol "Tambah Kandidat" di header untuk viewer (readonly)
  if (!canWrite) {
    const btnAdd = document.getElementById('btn-add');
    if (btnAdd) btnAdd.classList.add('hidden');
  }

  document.getElementById('btn-add').addEventListener('click', () => openCandidateModal());
  document.getElementById('btn-add-empty').addEventListener('click', () => openCandidateModal());
  document.getElementById('btn-retry').addEventListener('click', () => loadCandidates());

  document.getElementById('election-select').addEventListener('change', e => {
    _electionId = e.target.value;
    if (_electionId) {
      updateElectionMeta();
      loadCandidates();
    } else {
      Utils.hide(document.getElementById('election-meta'));
      showState('empty', {
        icon: 'fa-calendar-check',
        iconBg: 'bg-primary-50',
        iconColor: 'text-primary-400',
        title: 'Pilih pemilihan',
        text: 'Pilih pemilihan untuk mengelola kandidatnya.',
        showAdd: false,
      });
    }
  });

  await loadElectionOptions();
})();

// ── Load elections dropdown ───────────────────────────────────

async function loadElectionOptions() {
  const sel = document.getElementById('election-select');
  sel.disabled = true;

  const res = await API.election.getAll();

  sel.disabled = false;

  if (!res.success) {
    sel.innerHTML = '<option value="">— Gagal memuat pemilihan —</option>';
    showState('error', 'Gagal memuat daftar pemilihan. Coba muat ulang halaman.');
    return;
  }

  _elections = res.data || [];

  if (!_elections.length) {
    sel.innerHTML = '<option value="">— Belum ada pemilihan —</option>';
    showState('empty', {
      icon: 'fa-calendar-xmark',
      iconBg: 'bg-gray-100',
      iconColor: 'text-gray-400',
      title: 'Belum ada pemilihan',
      text: 'Buat pemilihan terlebih dahulu di Manajemen Pemilihan.',
      showAdd: false,
    });
    return;
  }

  sel.innerHTML = '<option value="">— Pilih Pemilihan —</option>' +
    _elections.map(e =>
      `<option value="${Utils.escapeHtml(e.id)}">${Utils.escapeHtml(e.title)}</option>`
    ).join('');

  // Auto-select jika hanya satu pemilihan
  if (_elections.length === 1) {
    sel.value   = _elections[0].id;
    _electionId = _elections[0].id;
    updateElectionMeta();
    await loadCandidates();
  } else {
    showState('empty', {
      icon: 'fa-hand-pointer',
      iconBg: 'bg-primary-50',
      iconColor: 'text-primary-400',
      title: 'Pilih pemilihan',
      text: 'Pilih pemilihan dari daftar di atas untuk mengelola kandidatnya.',
      showAdd: false,
    });
  }
}

// ── Load candidates ───────────────────────────────────────────

async function loadCandidates() {
  if (!_electionId) return;
  if (_isLoading) return;   // hindari parallel requests
  _isLoading = true;

  showState('loading');

  const res = await API.candidate.getAll(_electionId);
  _isLoading = false;

  if (!res.success) {
    document.getElementById('error-msg').textContent =
      res.message || 'Gagal memuat data kandidat.';
    showState('error');
    return;
  }

  _candidates = res.data || [];
  updateCandidateCount();

  if (!_candidates.length) {
    showState('empty', {
      icon: 'fa-user-plus',
      iconBg: 'bg-primary-50',
      iconColor: 'text-primary-400',
      title: 'Belum ada kandidat',
      text: 'Tambahkan kandidat pertama untuk pemilihan ini.',
      showAdd: true,
    });
    return;
  }

  renderCandidates();
  showState('content');
}

// ── Render grid ───────────────────────────────────────────────

function renderCandidates() {
  const grid = document.getElementById('candidates-grid');

  grid.innerHTML = _candidates
    .slice() // jangan mutasi array asli
    .sort((a, b) => (a.orderNumber || 0) - (b.orderNumber || 0))
    .map(c => candidateCardHtml(c))
    .join('');

  // Bind events via delegation
  grid.querySelectorAll('.edit-btn').forEach(btn => {
    btn.addEventListener('click', () => openCandidateModal(btn.dataset.id));
  });
  grid.querySelectorAll('.delete-btn').forEach(btn => {
    btn.addEventListener('click', () => confirmDeleteCandidate(btn.dataset.id));
  });
}

function candidateCardHtml(c) {
  const photoSrc     = Utils.buildImgUrl(c.photoUrl     || '');
  const pairPhotoSrc = Utils.buildImgUrl(c.pairPhotoUrl || '');
  const cardClass    = c.isActive !== false ? 'cand-card' : 'cand-card card-inactive';
  const role         = Auth.getAdminRole();
  const canWrite     = (role === 'superadmin' || role === 'admin' || role === 'ketua_panitia');

  return `
    <div class="${cardClass}" data-id="${Utils.escapeHtml(c.id)}">

      <!-- Photo strip -->
      <div class="cand-photo-strip relative">

        <!-- Nomor urut badge -->
        <span class="order-badge">No. ${Utils.escapeHtml(String(c.orderNumber || '?'))}</span>

        <!-- Status badge -->
        <span class="absolute top-2 right-2 z-10">
          ${c.isActive !== false
            ? `<span class="badge badge-success" style="font-size:9px;padding:2px 7px">Aktif</span>`
            : `<span class="badge badge-gray"    style="font-size:9px;padding:2px 7px">Nonaktif</span>`}
        </span>

        <!-- Divider line between photos -->
        <div class="absolute top-0 bottom-0 left-1/2 w-0.5 bg-white z-10" aria-hidden="true"></div>

        <!-- Foto ketua (kiri) -->
        <div class="candidate-photo-col relative">
          ${photoSrc
            ? `<img src="${Utils.escapeHtml(photoSrc)}" alt="${Utils.escapeHtml(c.name)}" loading="lazy"
                 referrerpolicy="no-referrer"
                 onerror="this.parentElement.innerHTML='<div class=\\'candidate-photo-placeholder\\'><i class=\\'fa-solid fa-user text-3xl text-gray-300\\'></i></div><div class=\\'role-label\\'>Ketua</div>'">`
            : ''}
          <div class="candidate-photo-placeholder" ${photoSrc ? 'style="display:none"' : ''}>
            <i class="fa-solid fa-user text-3xl text-gray-300"></i>
          </div>
          <div class="role-label">Ketua</div>
        </div>

        <!-- Foto wakil (kanan) -->
        <div class="candidate-photo-col relative">
          ${pairPhotoSrc
            ? `<img src="${Utils.escapeHtml(pairPhotoSrc)}" alt="${Utils.escapeHtml(c.pairName || 'Wakil')}" loading="lazy"
                 referrerpolicy="no-referrer"
                 onerror="this.parentElement.innerHTML='<div class=\\'candidate-photo-placeholder\\'><i class=\\'fa-solid fa-user text-3xl text-gray-300\\'></i></div><div class=\\'role-label\\'>Wakil</div>'">`
            : ''}
          <div class="candidate-photo-placeholder" ${pairPhotoSrc ? 'style="display:none"' : ''}>
            <i class="fa-solid fa-user text-3xl text-gray-300"></i>
          </div>
          <div class="role-label">Wakil</div>
        </div>

      </div>

      <!-- Info & actions -->
      <div class="p-4 flex-1 flex flex-col">

        <!-- Names -->
        <div class="flex-1 mb-3">
          <div class="flex items-start gap-2">
            <div class="w-1 h-full min-h-[32px] rounded-full bg-blue-400 flex-shrink-0 mt-0.5"></div>
            <div class="min-w-0 flex-1">
              <p class="text-sm font-bold text-gray-800 truncate leading-tight">${Utils.escapeHtml(c.name || '-')}</p>
              <p class="text-xs text-gray-500 truncate">${Utils.escapeHtml(c.className || '—')}</p>
            </div>
          </div>
          ${c.pairName ? `
          <div class="flex items-start gap-2 mt-2">
            <div class="w-1 h-full min-h-[32px] rounded-full bg-green-400 flex-shrink-0 mt-0.5"></div>
            <div class="min-w-0 flex-1">
              <p class="text-sm font-semibold text-gray-700 truncate leading-tight">${Utils.escapeHtml(c.pairName)}</p>
              <p class="text-xs text-gray-500 truncate">${Utils.escapeHtml(c.pairClassName || '—')}</p>
            </div>
          </div>` : `
          <div class="mt-2 flex items-center gap-1 text-xs text-gray-400">
            <i class="fa-solid fa-circle-minus text-xs"></i>
            <span>Tanpa calon wakil</span>
          </div>`}
          ${c.vision ? `

function updateElectionMeta() {
  const el = _elections.find(e => e.id === _electionId);
  const metaEl = document.getElementById('election-meta');
  if (!el || !metaEl) return;

  const statusMap = {
    draft:    { cls: 'badge-gray',    label: 'Draft' },
    upcoming: { cls: 'badge-info',    label: 'Akan Dimulai' },
    active:   { cls: 'badge-success', label: 'Berlangsung' },

  };

  metaEl.classList.add('flex');

  const countEl = document.getElementById('candidate-count');

    if (_candidates.length > 0) {

      toolbar.classList.add('flex');

      toolbar.classList.add('hidden');
    }
  }
}

function openCandidateModal(id) {
  if (!_electionId) {
    Toast.warning('Pilih pemilihan terlebih dahulu sebelum menambah kandidat.');
    return;
  }

  const data = id ? (_candidates.find(c => c.id === id) || null) : null;
  if (id && !data) {
    Toast.error('Data kandidat tidak ditemukan.');
    return;
  }

  // Reset upload state dan batalkan upload yang mungkin masih berjalan
  _cancelActiveUploads();
  _uploadState  = { main: 'none', pair: 'none' };
  _uploadAbort  = { main: null,   pair: null   };
  _isSubmitting = false;

  const modal = Modal.open({
    id: 'modal-candidate',
    title: id ? 'Edit Kandidat' : 'Tambah Kandidat Baru',
    body: candidateFormHtml(data || {}),
    size: 'xl',
    actions: [
      { label: 'Batal', class: 'btn-secondary', action: 'cancel' },
      {
        label: id ? 'Simpan Perubahan' : 'Tambah Kandidat',
        class: 'btn-primary',
        action: 'save',
        id: 'modal-save-btn',
      },
    ],
  });

  // Bind file input events
  const photoInput     = document.getElementById('f-photo');
  const pairPhotoInput = document.getElementById('f-pair-photo');
  if (photoInput)     photoInput.addEventListener('change',     e => previewAndUpload('main', e.target));
  if (pairPhotoInput) pairPhotoInput.addEventListener('change', e => previewAndUpload('pair', e.target));

  // Bind modal action buttons
  modal.querySelectorAll('[data-action]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (btn.dataset.action === 'cancel') {
        // Cancel upload yang sedang berjalan sebelum menutup modal
        _cancelActiveUploads();
        _isSubmitting = false;
        Modal.close();
        return;
      }
      if (btn.dataset.action === 'save') {
        if (_isSubmitting) return;
        await saveCandidate(id || null, btn);
      }
    });
  });
}

// ── Photo upload ──────────────────────────────────────────────
//
// Alur (direct upload — tidak lewat GAS sebagai proxy):
//   1. Kompres gambar di browser (Canvas) → kurangi ukuran sebelum kirim
//   2. Minta signature ke GAS → request JSON kecil, selesai <5 detik
//   3. Upload file langsung dari browser ke Cloudinary (AbortSignal)
//   4. URL Cloudinary disimpan di hidden input; dikirim ke GAS saat form disimpan
//
// Retry dengan exponential backoff: jeda 2s → 4s → 8s (maks 3 percobaan).
// Upload bisa di-cancel saat modal ditutup — tidak ada XHR menggantung.

const _MAX_UPLOAD_ATTEMPTS = 3;

/** Jeda non-blocking. */
function _sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

/** Batalkan semua upload aktif (dipanggil saat modal ditutup/dibuka ulang). */
function _cancelActiveUploads() {
  ['main', 'pair'].forEach(type => {
    if (_uploadAbort[type]) {
      try { _uploadAbort[type].abort(); } catch (_) {}
      _uploadAbort[type] = null;
    }
  });
}

/**
 * Kompres gambar menggunakan Canvas API sebelum upload.
 * Mengecilkan dimensi ke maks maxW×maxH dan menurunkan kualitas JPEG.
 * Jika file sudah kecil (< threshold), dikembalikan apa adanya.
 *
 * @param {File}   file    - File gambar asli
 * @param {number} maxW    - Lebar maksimal (default 1200px)
 * @param {number} maxH    - Tinggi maksimal (default 1500px)
 * @param {number} quality - Kualitas JPEG 0–1 (default 0.82)
 * @returns {Promise<File>} File terkompresi (atau asli jika sudah kecil)
 */
function _compressImage(file, maxW = 1200, maxH = 1500, quality = 0.82) {
  // Skip kompresi untuk file yang sudah kecil (< 300 KB) — tidak perlu
  if (file.size < 300 * 1024) return Promise.resolve(file);

  return new Promise((resolve) => {
    const img = new Image();
    const blobUrl = URL.createObjectURL(file);

    img.onload = () => {
      URL.revokeObjectURL(blobUrl);

      let { width, height } = img;

      // Hitung dimensi baru dengan mempertahankan aspect ratio
      const ratio = Math.min(maxW / width, maxH / height, 1); // 1 = jangan perbesar
      width  = Math.round(width  * ratio);
      height = Math.round(height * ratio);

      const canvas = document.createElement('canvas');
      canvas.width  = width;
      canvas.height = height;

      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);

      // Pilih output format: pertahankan PNG jika aslinya PNG dan kecil,
      // gunakan JPEG untuk foto (lebih kecil dari PNG untuk foto realistis)
      const outType = (file.type === 'image/png' && file.size < 1 * 1024 * 1024)
        ? 'image/png'
        : 'image/jpeg';

      canvas.toBlob(
        (blob) => {
          if (!blob) { resolve(file); return; } // fallback ke asli jika canvas gagal
          // Jika hasil kompresi lebih besar dari asli, pakai asli
          if (blob.size >= file.size) { resolve(file); return; }
          const compressed = new File([blob], file.name, { type: outType, lastModified: Date.now() });
          resolve(compressed);
        },
        outType,
        quality,
      );
    };

    img.onerror = () => {
      URL.revokeObjectURL(blobUrl);
      resolve(file); // fallback ke asli
    };

    img.src = blobUrl;
  });
}

/**
 * Render progress bar di dalam photo-thumb.
 * @param {HTMLElement} preview  - Elemen .photo-thumb
 * @param {string}      localUrl - Object URL untuk preview lokal
 * @param {number}      pct      - 0–100
 */
function _renderUploadProgress(preview, localUrl, pct) {
  preview.innerHTML = `
    <img src="${localUrl}" alt="Preview" style="opacity:.65">
    <div class="photo-thumb-spinner" style="flex-direction:column;gap:4px">
      <div class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
      ${pct > 0 ? `<span style="font-size:9px;color:#fff;font-weight:700;line-height:1">${pct}%</span>` : ''}
    </div>`;
}

async function previewAndUpload(type, input) {
  const file = input.files[0];
  if (!file) return;

  // Validasi format + ukuran sisi klien
  const validation = Utils.validateImageFile(file, 5);
  if (!validation.valid) {
    Toast.error(validation.error);
    input.value = '';
    return;
  }

  const previewId = type === 'main' ? 'preview-main'      : 'preview-pair';
  const urlId     = type === 'main' ? 'f-photo-url'       : 'f-pair-photo-url';
  const labelId   = type === 'main' ? 'upload-main-label' : 'upload-pair-label';

  const preview  = document.getElementById(previewId);
  const urlInput = document.getElementById(urlId);
  const labelEl  = document.getElementById(labelId);

  if (!preview || !urlInput) return;

  // Batalkan upload sebelumnya untuk slot ini (jika ada)
  if (_uploadAbort[type]) {
    try { _uploadAbort[type].abort(); } catch (_) {}
  }

  // Simpan URL lama untuk rollback
  const oldUrl = urlInput.value || '';

  // Set state uploading
  _uploadState[type] = 'uploading';
  if (labelEl) labelEl.textContent = 'Memproses...';

  // Tampilkan preview lokal segera
  const localUrl = URL.createObjectURL(file);
  _renderUploadProgress(preview, localUrl, 0);

  // ── Kompresi gambar sebelum upload ──────────────────────────
  let fileToUpload = file;
  try {
    fileToUpload = await _compressImage(file);
    const saved = file.size - fileToUpload.size;
    if (saved > 10 * 1024) {
      console.info(`[upload] Kompresi: ${(file.size/1024).toFixed(0)}KB → ${(fileToUpload.size/1024).toFixed(0)}KB`);
    }
  } catch {
    fileToUpload = file; // fallback ke asli
  }

  let lastError = null;

  for (let attempt = 1; attempt <= _MAX_UPLOAD_ATTEMPTS; attempt++) {
    // Buat AbortController baru per percobaan
    const abortCtrl = new AbortController();
    _uploadAbort[type] = abortCtrl;

    // Exponential backoff untuk retry berikutnya: 2s → 4s (maks 3 percobaan)
    // attempt=1 gagal → tunggu 2s sebelum attempt=2
    // attempt=2 gagal → tunggu 4s sebelum attempt=3
    const retryDelayMs = Math.min(2000 * (2 ** (attempt - 1)), 8000);

    try {
      if (labelEl) {
        labelEl.textContent = attempt > 1
          ? `Mencoba ulang ${attempt}/${_MAX_UPLOAD_ATTEMPTS}...`
          : 'Mengupload...';
      }

      // ── Langkah 1: Minta signature dari GAS ────────────────
      const sigRes = await API.candidate.getUploadSignature(oldUrl);

      // Cek apakah upload sudah di-cancel saat menunggu signature
      if (abortCtrl.signal.aborted) return;

      if (!sigRes.success || !sigRes.data) {
        // Bedakan error yang bisa di-retry (jaringan/timeout/server crash)
        // dari error yang tidak perlu di-retry (unauthorized, config salah, dll.)
        const isRetryable = sigRes._isRetryable === true
          || sigRes.errorCode === 'NETWORK_ERROR'
          || sigRes.errorCode === 'TIMEOUT_ERROR';

        if (isRetryable && attempt < _MAX_UPLOAD_ATTEMPTS) {
          // Lempar sebagai error biasa agar loop retry menangkap dan mencoba ulang
          throw new Error(sigRes.message || 'Gagal menghubungi server.');
        }

        // Error final atau non-retryable — rollback langsung
        URL.revokeObjectURL(localUrl);
        _rollbackPhotoPreview(preview, urlInput, oldUrl, labelEl, input);
        _uploadState[type] = 'error';
        _uploadAbort[type] = null;
        Toast.error(sigRes.message || 'Gagal mendapatkan izin upload. Coba lagi.');
        return;
      }

      // ── Langkah 2: Upload ke Cloudinary (dengan AbortSignal + eager) ──
      // sigRes.data.eager diteruskan ke API agar ikut di-apply oleh Cloudinary
      const cloudResult = await API.uploadToCloudinaryDirect(
        fileToUpload,
        sigRes.data,
        (pct) => {
          _renderUploadProgress(preview, localUrl, pct);
          if (labelEl) labelEl.textContent = `Mengupload ${pct}%...`;
        },
        abortCtrl.signal,
      );

      // ── Berhasil ──────────────────────────────────────────────
      URL.revokeObjectURL(localUrl);
      urlInput.value = cloudResult.url;
      _uploadAbort[type] = null;

      const displaySrc = Utils.buildImgUrl(cloudResult.url);
      preview.innerHTML = `<img src="${Utils.escapeHtml(displaySrc)}" alt="Foto ter-upload"
        referrerpolicy="no-referrer"
        onerror="this.parentElement.innerHTML='<i class=\\'fa-solid fa-user text-gray-300 text-xl\\'></i>'">`;

      _uploadState[type] = 'done';
      if (labelEl) labelEl.textContent = 'Ganti Foto';
      Toast.success('Foto berhasil diupload.');
      return; // selesai

    } catch (err) {
      // Jika di-cancel (modal ditutup) — berhenti tanpa pesan error
      if (err.message === 'Upload dibatalkan.' || abortCtrl.signal.aborted) {
        URL.revokeObjectURL(localUrl);
        _uploadState[type] = 'none';
        _uploadAbort[type] = null;
        return;
      }

      lastError = err;
      console.warn(`[upload] percobaan ${attempt}/${_MAX_UPLOAD_ATTEMPTS} gagal:`, err.message);

      if (attempt < _MAX_UPLOAD_ATTEMPTS) {
        if (labelEl) labelEl.textContent = `Gagal, tunggu ${retryDelayMs / 1000}s...`;
        // Tampilkan countdown singkat di preview agar user tahu
        _renderUploadProgress(preview, localUrl, 0);
        await _sleep(retryDelayMs);
        // Cek lagi setelah sleep — user mungkin sudah tutup modal
        if (!document.getElementById(previewId)) {
          URL.revokeObjectURL(localUrl);
          return;
        }
      }
    }
  }

  // ── Semua percobaan gagal ─────────────────────────────────
  console.error('[upload] semua percobaan gagal:', lastError?.message);
  URL.revokeObjectURL(localUrl);
  _rollbackPhotoPreview(preview, urlInput, oldUrl, labelEl, input);
  _uploadState[type] = 'error';
  _uploadAbort[type] = null;

  // Pesan yang spesifik sesuai jenis error
  const _errMsg = lastError?.message || '';
  const _isServerUnreachable = _errMsg.includes('menghubungi server')
    || _errMsg.includes('terhubung')
    || _errMsg.includes('Cloudinary')
    || _errMsg.includes('timeout')
    || _errMsg.includes('Timeout');
  Toast.error(
    _isServerUnreachable
      ? `Koneksi gagal setelah ${_MAX_UPLOAD_ATTEMPTS}x percobaan. Pastikan internet stabil, lalu coba lagi.`
      : (_errMsg ? `Upload gagal: ${_errMsg}` : 'Gagal mengupload foto. Periksa koneksi dan coba lagi.'),
  );
}

/**
 * Rollback preview ke kondisi sebelum upload jika semua percobaan gagal.
 */
function _rollbackPhotoPreview(preview, urlInput, oldUrl, labelEl, input) {
  if (oldUrl) {
    const displaySrc = Utils.buildImgUrl(oldUrl);
    preview.innerHTML = `<img src="${Utils.escapeHtml(displaySrc)}" alt="Foto"
      referrerpolicy="no-referrer"
      onerror="this.parentElement.innerHTML='<i class=\\'fa-solid fa-user text-gray-300 text-xl\\'></i>'">`;
  } else {
    preview.innerHTML = `<i class="fa-solid fa-user text-gray-300 text-xl"></i>`;
  }
  urlInput.value = oldUrl;
  if (input) input.value = '';
  if (labelEl) labelEl.textContent = oldUrl ? 'Ganti Foto' : 'Pilih Foto';
}

// ── Save candidate (create / update) ─────────────────────────

async function saveCandidate(id, btn) {
  // Blokir jika masih ada upload yang sedang berjalan
  if (_uploadState.main === 'uploading' || _uploadState.pair === 'uploading') {
    Toast.warning('Tunggu hingga proses upload foto selesai sebelum menyimpan.');
    return;
  }

  // Ambil nilai form
  const nameEl   = document.getElementById('f-name');
  const name     = nameEl?.value.trim() ?? '';

  // Validasi inline
  const errEl = document.getElementById('f-name-error');
  if (!name) {
    if (nameEl) nameEl.classList.add('form-input-error');
    if (errEl) errEl.innerHTML =
      `<i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i> Nama calon ketua wajib diisi.`;
    nameEl?.focus();
    return;
  }
  if (name.length < 2) {
    if (nameEl) nameEl.classList.add('form-input-error');
    if (errEl) errEl.innerHTML =
      `<i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i> Nama minimal 2 karakter.`;
    nameEl?.focus();
    return;
  }

  // Bersihkan error setelah validasi lewat
  nameEl?.classList.remove('form-input-error');
  if (errEl) errEl.innerHTML = '';

  // Set guard
  _isSubmitting = true;
  Utils.setLoading(btn, true, 'Menyimpan...');

  const orderRaw = parseInt(document.getElementById('f-order')?.value || '0', 10);

  const payload = {
    electionId:     _electionId,
    orderNumber:    isNaN(orderRaw) || orderRaw <= 0 ? 0 : orderRaw,
    name,
    photoUrl:       document.getElementById('f-photo-url')?.value     || '',
    className:      document.getElementById('f-class')?.value.trim()  || '',
    pairName:       document.getElementById('f-pair-name')?.value.trim()  || '',
    pairPhotoUrl:   document.getElementById('f-pair-photo-url')?.value    || '',
    pairClassName:  document.getElementById('f-pair-class')?.value.trim() || '',
    vision:         document.getElementById('f-vision')?.value.trim()    || '',
    mission:        document.getElementById('f-mission')?.value.trim()   || '',
    programs:       document.getElementById('f-programs')?.value.trim()  || '',
    additionalInfo: document.getElementById('f-info')?.value.trim()      || '',
    isActive:       document.getElementById('f-active')?.checked !== false,
  };
  if (id) payload.id = id;

  try {
    const res = id
      ? await API.candidate.update(payload)
      : await API.candidate.create(payload);

    if (res.success) {
      Toast.success(id ? 'Kandidat berhasil diperbarui.' : 'Kandidat berhasil ditambahkan.');
      Modal.close();
      await loadCandidates();
    } else {
      Toast.error(res.message || 'Terjadi kesalahan. Silakan coba lagi.');
    }
  } catch (err) {
    console.error('[saveCandidate] unexpected error:', err);
    Toast.error('Terjadi kesalahan tak terduga. Silakan coba lagi.');
  } finally {
    Utils.setLoading(btn, false);
    _isSubmitting = false;
  }
}

// ── Delete candidate ──────────────────────────────────────────

async function confirmDeleteCandidate(id) {
  const c = _candidates.find(x => x.id === id);
  if (!c) return;

  const ok = await Utils.confirm(
    `Hapus kandidat "${c.name}"?\n\nJika kandidat sudah menerima suara, penghapusan akan ditolak oleh server.`,
    'Konfirmasi Hapus',
    true
  );
  if (!ok) return;

  const res = await API.candidate.delete(id);
  if (res.success) {
    Toast.success('Kandidat berhasil dihapus.');
    await loadCandidates();
  } else {
    Toast.error(res.message || 'Gagal menghapus kandidat.');
  }
}

// ── Show State ────────────────────────────────────────────────

/**
 * Kontrol visibility state utama.
 * @param {string} s  - 'loading' | 'content' | 'empty' | 'error'
 * @param {Object|string} [emptyConfig] - konfigurasi empty state
 */
function showState(s, emptyConfig) {
  const states = ['loading', 'content', 'empty', 'error'];
  states.forEach(name => {
    const el = document.getElementById(`${name}-state`);
    if (el) el.classList.toggle('hidden', s !== name);
  });

  // Update toolbar visibility
  const toolbar = document.getElementById('toolbar');
  if (toolbar && s !== 'content') {
    toolbar.classList.add('hidden');
  }

  // Konfigurasi empty state
  if (s === 'empty' && emptyConfig) {
    const cfg = typeof emptyConfig === 'string'
      ? { text: emptyConfig, title: '', icon: 'fa-users-slash', iconBg: 'bg-gray-100', iconColor: 'text-gray-400', showAdd: false }
      : emptyConfig;

    const iconWrap = document.getElementById('empty-icon-wrap');
    const iconEl   = document.getElementById('empty-icon');
    const titleEl  = document.getElementById('empty-title');
    const textEl   = document.getElementById('empty-text');
    const addBtn   = document.getElementById('btn-add-empty');

    if (iconWrap) {
      iconWrap.className = `state-icon-wrap mx-auto ${cfg.iconBg || 'bg-gray-100'} ${cfg.iconColor || 'text-gray-400'}`;
    }
    if (iconEl)  iconEl.className = `fa-solid ${cfg.icon || 'fa-users-slash'}`;
    if (titleEl) titleEl.textContent = cfg.title || '';
    if (textEl)  textEl.textContent  = cfg.text  || '';
    if (addBtn) {
      if (cfg.showAdd && _electionId) {
        addBtn.classList.remove('hidden');
      } else {
        addBtn.classList.add('hidden');
      }
    }
  }
}
