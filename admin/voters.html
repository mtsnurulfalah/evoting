<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manajemen Pemilih — eVoting OSIM Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <link rel="stylesheet" href="../assets/css/tailwind.css"/>
</head>
<body class="h-full bg-gray-50 flex">
<div id="toast-container"></div>
<div id="sidebar-overlay" class="fixed inset-0 bg-black/40 z-30 hidden lg:hidden"></div>

<aside id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-white border-r border-gray-200 z-40 flex flex-col transition-transform duration-300 -translate-x-full lg:translate-x-0 lg:static lg:z-auto">
  <div class="px-5 py-4 border-b border-gray-100">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 bg-primary-600 rounded-xl flex items-center justify-center flex-shrink-0"><i class="fa-solid fa-box-ballot text-white"></i></div>
      <div class="min-w-0">
        <p class="text-sm font-bold text-gray-800 truncate" id="sidebar-app-name">eVoting OSIM</p>
        <p class="text-xs text-gray-500 truncate" id="sidebar-school-name"></p>
      </div>
    </div>
  </div>
  <nav class="flex-1 p-3 space-y-0.5 overflow-y-auto"></nav>
  <div class="p-3 border-t border-gray-100">
    <div class="flex items-center gap-3 px-2 py-2 rounded-lg">
      <div id="topbar-user-avatar" class="w-8 h-8 rounded-full overflow-hidden flex-shrink-0 bg-primary-100 flex items-center justify-center"></div>
      <div class="flex-1 min-w-0">
        <p class="text-xs font-semibold text-gray-800 truncate" id="topbar-user-name"></p>
        <p class="text-xs text-gray-500" id="topbar-user-role"></p>
      </div>
      <button id="topbar-logout-btn" class="text-gray-400 hover:text-red-500 transition-colors p-1"><i class="fa-solid fa-right-from-bracket text-sm"></i></button>
    </div>
  </div>
</aside>

<div class="flex-1 flex flex-col min-w-0">
  <header class="bg-white border-b border-gray-200 px-4 h-14 flex items-center gap-3 sticky top-0 z-20">
    <button id="sidebar-toggle" class="lg:hidden text-gray-500 hover:text-gray-700 p-1"><i class="fa-solid fa-bars text-lg"></i></button>
    <h1 class="text-base font-semibold text-gray-800 flex-1">Manajemen Pemilih</h1>
    <button id="btn-import" class="btn btn-outline btn-sm text-xs">
      <i class="fa-solid fa-file-import"></i> <span class="hidden sm:inline">Import CSV</span>
    </button>
    <button id="btn-export" class="btn btn-outline btn-sm text-xs">
      <i class="fa-solid fa-file-export"></i> <span class="hidden sm:inline">Export</span>
    </button>
    <button id="btn-add" class="btn btn-primary btn-sm text-xs">
      <i class="fa-solid fa-plus"></i> <span class="hidden sm:inline">Tambah</span>
    </button>
    <!-- Badge readonly untuk Panitia — ditampilkan via JS -->
    <span id="badge-readonly" class="hidden badge badge-warning text-xs gap-1">
      <i class="fa-solid fa-eye fa-xs"></i> Hanya Lihat
    </span>
  </header>

  <main class="flex-1 p-4 md:p-6 overflow-auto">
    <!-- Filter bar -->
    <div class="card p-4 mb-5">
      <div class="flex flex-col sm:flex-row gap-3">
        <select id="election-select" class="form-select sm:w-52">
          <option value="">— Pilih Pemilihan —</option>
        </select>
        <div class="relative flex-1">
          <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
          <input type="text" id="search-input" class="form-input pl-9" placeholder="Cari nama, NISN, kelas..."/>
        </div>
        <select id="filter-voted" class="form-select sm:w-40">
          <option value="">Semua Status</option>
          <option value="false">Belum Memilih</option>
          <option value="true">Sudah Memilih</option>
        </select>
        <button id="btn-reset-filter" class="btn btn-secondary btn-sm text-xs flex-shrink-0">
          <i class="fa-solid fa-rotate-left"></i> Reset
        </button>
      </div>
    </div>

    <!-- Summary stats -->
    <div class="grid grid-cols-3 gap-3 mb-5" id="voter-stats">
      <div class="card p-3 text-center"><p class="text-xl font-extrabold text-gray-800" id="s-total">-</p><p class="text-xs text-gray-500">Total</p></div>
      <div class="card p-3 text-center bg-green-50"><p class="text-xl font-extrabold text-green-600" id="s-voted">-</p><p class="text-xs text-gray-500">Sudah Memilih</p></div>
      <div class="card p-3 text-center bg-orange-50"><p class="text-xl font-extrabold text-orange-600" id="s-not-voted">-</p><p class="text-xs text-gray-500">Belum Memilih</p></div>
    </div>

    <!-- Table -->
    <div class="card">
      <div id="loading-state" class="text-center py-16">
        <div class="inline-block w-8 h-8 border-4 border-primary-200 border-t-primary-600 rounded-full animate-spin mb-3"></div>
        <p class="text-gray-500 text-sm">Memuat data...</p>
      </div>
      <div id="content-state" class="hidden">
        <div class="table-wrapper rounded-t-none border-0">
          <table class="table">
            <thead>
              <tr>
                <th>Nama / NISN</th>
                <th class="hidden md:table-cell">Kelas</th>
                <th class="hidden lg:table-cell">Tgl Lahir</th>
                <th class="hidden xl:table-cell" id="th-pin">PIN</th>
                <th>Status</th>
                <th class="text-right">Aksi</th>
              </tr>
            </thead>
            <tbody id="voters-tbody"></tbody>
          </table>
        </div>
        <div class="px-4 py-3 border-t border-gray-100" id="pagination-container"></div>
      </div>
      <div id="empty-state" class="hidden empty-state py-14">
        <i class="fa-solid fa-users-slash"></i>
        <p id="empty-msg">Pilih pemilihan terlebih dahulu.</p>
      </div>
    </div>
  </main>
</div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/utils.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/components.js"></script>
<script>
let _electionId = '';
let _currentPage = 1;
let _pageSize = 25;
let _lastMeta = null;

(async () => {
  if (!Auth.requireAdminPage()) return;
  Sidebar.init(); Topbar.init();

  // Kontrol UI berdasarkan hak akses
  const _isReadonly = Auth.getAdminRole() === 'viewer' || Auth.isPanitia();
  if (_isReadonly) {
    // Sembunyikan tombol write, tampilkan badge readonly
    document.getElementById('btn-add').classList.add('hidden');
    document.getElementById('btn-import').classList.add('hidden');
    document.getElementById('badge-readonly').classList.remove('hidden');
  }

  if (!_isReadonly) {
    document.getElementById('btn-add').addEventListener('click', () => openVoterModal());
    document.getElementById('btn-import').addEventListener('click', openImportModal);
  }
  document.getElementById('btn-export').addEventListener('click', exportVoters);
  document.getElementById('btn-reset-filter').addEventListener('click', resetFilter);
  document.getElementById('election-select').addEventListener('change', e => {
    _electionId = e.target.value; _currentPage = 1;
    if (_electionId) loadVoters(); else showState('empty', 'Pilih pemilihan terlebih dahulu.');
  });
  document.getElementById('search-input').addEventListener('input', Utils.debounce(() => { _currentPage=1; loadVoters(); }, 400));
  document.getElementById('filter-voted').addEventListener('change', () => { _currentPage=1; loadVoters(); });

  await loadElectionOptions();
})();

async function loadElectionOptions() {
  const res = await API.election.getAll();
  if (!res.success) return;
  const elections = res.data || [];
  const sel = document.getElementById('election-select');
  sel.innerHTML = '<option value="">— Pilih Pemilihan —</option>' +
    elections.map(e => `<option value="${e.id}">${Utils.escapeHtml(e.title)}</option>`).join('');
  if (elections.length === 1) {
    sel.value = elections[0].id; _electionId = elections[0].id; loadVoters();
  } else {
    showState('empty', 'Pilih pemilihan terlebih dahulu.');
  }
}

async function loadVoters() {
  if (!_electionId) return;
  showState('loading');

  // Muat stats agregat (tanpa filter) dan data tabel (dengan filter) secara paralel
  const [statsRes, tableRes] = await Promise.all([
    API.voter.getAll({ electionId: _electionId, page: 1, pageSize: 1 }),
    API.voter.getAll({
      electionId: _electionId,
      search:   document.getElementById('search-input').value.trim(),
      hasVoted: document.getElementById('filter-voted').value,
      page:     _currentPage,
      pageSize: _pageSize,
    }),
  ]);

  if (!tableRes.success) { Toast.error(tableRes.message); showState('empty', 'Gagal memuat data.'); return; }

  const data = tableRes.data || {};
  _lastMeta = data;

  // Stats akurat dari request tanpa filter
  if (statsRes.success && statsRes.data) {
    document.getElementById('s-total').textContent = Utils.formatNumber(statsRes.data.total || 0);
  }

  renderTable(data.items || []);
  Pagination.render(
    document.getElementById('pagination-container'),
    { page: data.page, totalPages: data.totalPages, total: data.total, pageSize: data.pageSize },
    p => { _currentPage = p; loadVoters(); }
  );
  showState('content');
}

function renderStats(data) {
  // data.total = total dari filtered query (sesuai search/filter aktif)
  document.getElementById('s-total').textContent = Utils.formatNumber(data.total || 0);
  // Catatan: s-voted dan s-not-voted diisi oleh renderTable dari current page.
  // Untuk akurasi penuh di page > 1, nilai ini hanya mencerminkan halaman saat ini.
  // Stats akurat tersedia di dashboard admin melalui result.getDashboard().
}

function renderTable(voters) {
  const isSuperAdmin = Auth.isSuperAdmin();
  const isViewer     = Auth.getAdminRole() === 'viewer' || Auth.isPanitia();
  let voted = 0, notVoted = 0;
  const tbody = document.getElementById('voters-tbody');
  tbody.innerHTML = voters.map(v => {
    if (v.hasVoted) voted++; else notVoted++;

    // Kolom PIN: tampilkan status set/belum; hanya superadmin yang bisa melihat indikator detail
    const pinBadge = v.hasPinSet
      ? `<span class="inline-flex items-center gap-1 text-xs text-green-700 bg-green-50 border border-green-200 rounded px-1.5 py-0.5"><i class="fa-solid fa-circle-check fa-xs"></i>Aktif</span>`
      : `<span class="inline-flex items-center gap-1 text-xs text-red-600 bg-red-50 border border-red-200 rounded px-1.5 py-0.5"><i class="fa-solid fa-circle-xmark fa-xs"></i>Belum</span>`;

    return `
      <tr>
        <td>
          <div>
            <p class="font-medium text-gray-800 text-sm">${Utils.escapeHtml(v.name)}</p>
            <p class="text-xs text-gray-500 font-mono">${Utils.escapeHtml(v.nisn)}</p>
          </div>
        </td>
        <td class="hidden md:table-cell text-sm">${Utils.escapeHtml(v.className||'-')}</td>
        <td class="hidden lg:table-cell text-sm">${Utils.formatDate(v.birthDate, {day:'2-digit',month:'2-digit',year:'numeric'})}</td>
        <td class="hidden xl:table-cell">${pinBadge}</td>
        <td>
          <span class="badge ${v.hasVoted ? 'badge-success' : 'badge-warning'}">
            <i class="fa-solid fa-${v.hasVoted ? 'check-circle' : 'clock'} fa-xs"></i>
            ${v.hasVoted ? 'Sudah' : 'Belum'}
          </span>
        </td>
        <td>
          <div class="flex items-center justify-end gap-1">
            ${!isViewer ? `<button class="btn btn-icon btn-sm btn-outline voter-edit-btn"
              data-voter-id="${Utils.escapeHtml(v.id)}" title="Edit">
              <i class="fa-solid fa-pen-to-square text-xs"></i></button>` : ''}
            ${isSuperAdmin ? `<button class="btn btn-icon btn-sm btn-outline voter-pin-btn"
              data-voter-id="${Utils.escapeHtml(v.id)}" title="Reset PIN">
              <i class="fa-solid fa-key text-xs"></i></button>` : ''}
            ${isSuperAdmin && v.hasVoted ? `<button class="btn btn-icon btn-sm btn-warning voter-reset-btn"
              data-voter-id="${Utils.escapeHtml(v.id)}" title="Reset Status">
              <i class="fa-solid fa-rotate text-xs"></i></button>` : ''}
            ${!isViewer ? `<button class="btn btn-icon btn-sm btn-danger voter-delete-btn"
              data-voter-id="${Utils.escapeHtml(v.id)}"
              data-voter-name="${Utils.escapeHtml(v.name)}" title="Hapus">
              <i class="fa-solid fa-trash text-xs"></i></button>` : ''}
            ${isViewer ? `<span class="text-xs text-gray-400 italic">—</span>` : ''}
          </div>
        </td>
      </tr>`;
  }).join('');
  document.getElementById('s-voted').textContent     = Utils.formatNumber(voted);
  document.getElementById('s-not-voted').textContent  = Utils.formatNumber(notVoted);

  // Event delegation untuk action buttons (data-* approach, safe dari XSS)
  tbody.querySelectorAll('.voter-edit-btn').forEach(btn => {
    btn.addEventListener('click', () => openVoterModal(btn.dataset.voterId));
  });
  tbody.querySelectorAll('.voter-pin-btn').forEach(btn => {
    btn.addEventListener('click', () => resetVoterPin(btn.dataset.voterId));
  });
  tbody.querySelectorAll('.voter-reset-btn').forEach(btn => {
    btn.addEventListener('click', () => resetVoteStatus(btn.dataset.voterId));
  });
  tbody.querySelectorAll('.voter-delete-btn').forEach(btn => {
    btn.addEventListener('click', () => confirmDeleteVoter(btn.dataset.voterId, btn.dataset.voterName));
  });
}

function resetFilter() {
  document.getElementById('search-input').value = '';
  document.getElementById('filter-voted').value = '';
  _currentPage = 1; loadVoters();
}

// ── Voter Modal ────────────────────────────────────────────

function voterFormHtml(data = {}) {
  return `
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div class="form-group"><label class="form-label text-xs">Nama Lengkap <span class="text-red-500">*</span></label>
        <input type="text" id="f-name" class="form-input" value="${Utils.escapeHtml(data.name||'')}" placeholder="Nama siswa"/></div>
      <div class="form-group"><label class="form-label text-xs">NISN <span class="text-red-500">*</span></label>
        <input type="text" id="f-nisn" class="form-input font-mono" value="${Utils.escapeHtml(data.nisn||'')}" placeholder="10 digit" maxlength="10" ${data.nisn ? 'readonly title="NISN tidak dapat diubah"' : ''}/></div>
      <div class="form-group"><label class="form-label text-xs">Kelas</label>
        <input type="text" id="f-class" class="form-input" value="${Utils.escapeHtml(data.className||'')}" placeholder="XII IPA 1"/></div>
      <div class="form-group"><label class="form-label text-xs">Tempat Lahir <span class="text-red-500">*</span></label>
        <input type="text" id="f-birth-place" class="form-input" value="${Utils.escapeHtml(data.birthPlace||'')}" placeholder="Jakarta"/></div>
      <div class="form-group"><label class="form-label text-xs">Tanggal Lahir <span class="text-red-500">*</span></label>
        <input type="date" id="f-birth-date" class="form-input" value="${data.birthDate ? data.birthDate.substring(0,10) : ''}"/></div>
      ${!data.nisn ? `<div class="form-group"><label class="form-label text-xs">PIN 5 Digit <span class="text-red-500">*</span></label>
        <input type="text" id="f-pin" class="form-input font-mono" placeholder="12345" maxlength="5" inputmode="numeric"/>
        <p class="form-hint">PIN yang diberikan ke siswa untuk login.</p></div>` : ''}
      <div class="form-group sm:col-span-2 mb-0 flex items-center gap-3">
        <label class="flex items-center gap-2 cursor-pointer select-none text-sm">
          <input type="checkbox" id="f-active" class="w-4 h-4 accent-primary-600" ${data.isActive !== false ? 'checked':''}/> Akun Aktif
        </label>
      </div>
    </div>`;
}

function openVoterModal(id) {
  if (!_electionId) { Toast.warning('Pilih pemilihan terlebih dahulu.'); return; }
  const modal = Modal.open({
    id: 'modal-voter', title: id ? 'Edit Pemilih' : 'Tambah Pemilih',
    body: '<div class="text-center py-4"><div class="inline-block w-6 h-6 border-2 border-primary-200 border-t-primary-600 rounded-full animate-spin"></div></div>',
    size: 'lg',
    actions: [
      { label: 'Batal', class: 'btn-secondary', action: 'cancel' },
      { label: id ? 'Simpan' : 'Tambah', class: 'btn-primary', action: 'save', id: 'modal-save-btn' },
    ],
  });

  // Tandai modal dengan token unik agar kita bisa cek apakah masih aktif
  const modalToken = Date.now();
  modal.dataset.token = modalToken;

  // Load data secara async
  (async () => {
    let data = {};
    if (id) {
      const res = await API.voter.getById(id);
      if (res.success) data = res.data;
    }
    // Cek apakah modal yang sama masih terbuka (user belum menutupnya)
    const currentModal = document.getElementById('modal-voter');
    if (!currentModal || currentModal.dataset.token !== String(modalToken)) return;
    Modal.updateBody('modal-voter', voterFormHtml(data));
  })();

  modal.querySelectorAll('[data-action]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (btn.dataset.action === 'cancel') { Modal.close(); return; }
      await saveVoter(id || null, btn);
    });
  });
}

async function saveVoter(id, btn) {
  const name       = document.getElementById('f-name')?.value.trim();
  const nisn       = document.getElementById('f-nisn')?.value.trim();
  const birthPlace = document.getElementById('f-birth-place')?.value.trim();
  const birthDate  = document.getElementById('f-birth-date')?.value;
  const pin        = document.getElementById('f-pin')?.value.trim();

  if (!name) { Toast.warning('Nama wajib diisi.'); return; }
  if (!id && !nisn) { Toast.warning('NISN wajib diisi.'); return; }
  if (!id && !/^\d{10}$/.test(nisn)) { Toast.warning('NISN harus 10 digit angka.'); return; }
  if (!birthPlace) { Toast.warning('Tempat lahir wajib diisi.'); return; }
  if (!birthDate) { Toast.warning('Tanggal lahir wajib diisi.'); return; }
  if (!id && (!pin || !/^\d{5}$/.test(pin))) { Toast.warning('PIN harus 5 digit angka.'); return; }

  Utils.setLoading(btn, true, 'Menyimpan...');
  const payload = {
    electionId: _electionId, name, className: document.getElementById('f-class')?.value.trim()||'',
    birthPlace, birthDate,
    isActive: document.getElementById('f-active')?.checked !== false,
  };
  if (!id) { payload.nisn = nisn; payload.pin = pin; }
  else payload.id = id;

  const res = id ? await API.voter.update(payload) : await API.voter.create(payload);
  Utils.setLoading(btn, false);
  if (res.success) { Toast.success(id ? 'Data pemilih diperbarui.' : 'Pemilih ditambahkan.'); Modal.close(); loadVoters(); }
  else Toast.error(res.message);
}

// ── Import CSV Modal ───────────────────────────────────────

function openImportModal() {
  if (!_electionId) { Toast.warning('Pilih pemilihan terlebih dahulu.'); return; }
  const modal = Modal.open({
    id: 'modal-import', title: 'Import Pemilih dari CSV', size: 'lg',
    body: `
      <div class="space-y-4">
        <div class="alert alert-info text-sm">
          <i class="fa-solid fa-circle-info flex-shrink-0"></i>
          <div>
            <p class="font-medium mb-1">Format CSV yang diperlukan:</p>
            <p class="font-mono text-xs">nisn,name,className,birthPlace,birthDate,pin</p>
            <p class="text-xs mt-1 opacity-80">birthDate: format YYYY-MM-DD. pin: 5 digit angka.</p>
          </div>
        </div>
        <div class="upload-area" id="csv-upload-area" onclick="document.getElementById('csv-file').click()">
          <i class="fa-solid fa-file-csv text-4xl text-gray-300 mb-2"></i>
          <p class="text-sm text-gray-600 font-medium">Klik untuk pilih file CSV</p>
          <p class="text-xs text-gray-400 mt-1">Maksimal 500 pemilih per file</p>
          <input type="file" id="csv-file" accept=".csv,text/csv" class="hidden" onchange="previewCSV(this)"/>
        </div>
        <div id="csv-preview" class="hidden">
          <p class="text-xs font-semibold text-gray-600 mb-2" id="csv-count"></p>
          <div class="table-wrapper max-h-48">
            <table class="table text-xs"><thead><tr id="csv-head"></tr></thead><tbody id="csv-body"></tbody></table>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <input type="checkbox" id="skip-dup" class="w-4 h-4 accent-primary-600" checked/>
          <label for="skip-dup" class="text-sm cursor-pointer">Lewati NISN yang sudah terdaftar (skip duplikat)</label>
        </div>
      </div>`,
    actions: [
      { label: 'Batal', class: 'btn-secondary', action: 'cancel' },
      { label: 'Import', class: 'btn-primary', action: 'import', id: 'modal-import-btn' },
    ],
  });
  modal.querySelectorAll('[data-action]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (btn.dataset.action === 'cancel') { Modal.close(); return; }
      await doImport(btn);
    });
  });
}

let _parsedCSV = [];

function previewCSV(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    _parsedCSV = Utils.parseCSV(e.target.result);
    const preview = document.getElementById('csv-preview');
    const countEl = document.getElementById('csv-count');
    const head    = document.getElementById('csv-head');
    const body    = document.getElementById('csv-body');
    if (!_parsedCSV.length) { Toast.warning('File CSV kosong atau format tidak valid.'); return; }
    countEl.textContent = `${_parsedCSV.length} baris data ditemukan`;
    const headers = Object.keys(_parsedCSV[0]);
    head.innerHTML = headers.map(h => `<th>${Utils.escapeHtml(h)}</th>`).join('');
    body.innerHTML = _parsedCSV.slice(0, 5).map(row =>
      `<tr>${headers.map(h => `<td>${Utils.escapeHtml(String(row[h]||''))}</td>`).join('')}</tr>`
    ).join('') + (_parsedCSV.length > 5 ? `<tr><td colspan="${headers.length}" class="text-center text-gray-400 py-2">... dan ${_parsedCSV.length-5} baris lainnya</td></tr>` : '');
    preview.classList.remove('hidden');
  };
  reader.readAsText(file);
}

async function doImport(btn) {
  if (!_parsedCSV.length) { Toast.warning('Pilih file CSV terlebih dahulu.'); return; }
  Utils.setLoading(btn, true, 'Mengimpor...');
  const skipDup = document.getElementById('skip-dup')?.checked !== false;
  const res = await API.voter.importBulk(_electionId, _parsedCSV, skipDup);
  Utils.setLoading(btn, false);
  if (res.success) {
    const d = res.data;
    Toast.success(`Import selesai: ${d.success} berhasil, ${d.skipped} dilewati, ${d.failed} gagal.`, 0);
    if (d.errors && d.errors.length > 0) {
      console.warn('Import errors:', d.errors);
    }
    Modal.close(); _parsedCSV = []; loadVoters();
  } else {
    Toast.error(res.message);
  }
}

// ── Actions ────────────────────────────────────────────────

async function resetVoterPin(id) {
  const pin = prompt('Masukkan PIN baru (5 digit angka):');
  if (!pin) return;
  if (!/^\d{5}$/.test(pin.trim())) { Toast.warning('PIN harus 5 digit angka.'); return; }
  const res = await API.voter.resetPin(id, pin.trim());
  if (res.success) Toast.success('PIN berhasil direset.');
  else Toast.error(res.message);
}

async function resetVoteStatus(id) {
  const ok = await Utils.confirm('Reset status voting pemilih ini? Pemilih akan bisa memilih lagi.', 'Reset Status', true);
  if (!ok) return;
  const res = await API.voter.resetVoteStatus({ id });
  if (res.success) { Toast.success('Status berhasil direset.'); loadVoters(); }
  else Toast.error(res.message);
}

async function confirmDeleteVoter(id, name) {
  const ok = await Utils.confirm(`Hapus pemilih "${name}"?`, 'Konfirmasi Hapus', true);
  if (!ok) return;
  const res = await API.voter.delete(id);
  if (res.success) { Toast.success('Pemilih berhasil dihapus.'); loadVoters(); }
  else Toast.error(res.message);
}

async function exportVoters() {
  if (!_electionId) { Toast.warning('Pilih pemilihan terlebih dahulu.'); return; }
  Loader.show('Mengekspor data...');
  const res = await API.voter.getAll({ electionId: _electionId, pageSize: 9999 });
  Loader.hide();
  if (!res.success || !res.data?.items?.length) { Toast.warning('Tidak ada data untuk diekspor.'); return; }
  const rows = res.data.items.map(v => ({
    nisn: v.nisn, name: v.name, className: v.className,
    birthPlace: v.birthPlace, birthDate: v.birthDate,
    hasVoted: v.hasVoted ? 'Ya' : 'Tidak',
    votedAt: v.hasVoted ? Utils.formatDateTime(v.votedAt) : '',
  }));
  Utils.exportCSV(rows, 'pemilih-' + _electionId + '.csv');
}

function showState(s, emptyMsg) {
  document.getElementById('loading-state').classList.toggle('hidden', s !== 'loading');
  document.getElementById('content-state').classList.toggle('hidden', s !== 'content');
  document.getElementById('empty-state').classList.toggle('hidden', s !== 'empty');
  if (emptyMsg) { const el = document.getElementById('empty-msg'); if (el) el.textContent = emptyMsg; }
}
</script>
