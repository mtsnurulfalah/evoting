<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Suara Berhasil — eVoting OSIM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <link rel="stylesheet" href="/assets/css/tailwind.css"/>
  <style>
    @keyframes scaleIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes checkDraw { to { stroke-dashoffset: 0; } }
    .check-animate { animation: scaleIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    .confetti-piece {
      position: fixed;
      width: 10px; height: 10px;
      animation: confettiFall linear forwards;
    }
    @keyframes confettiFall {
      0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-green-50 via-white to-primary-50 flex flex-col">

<div id="toast-container"></div>
<div id="confetti-container"></div>

<!-- Topbar minimal -->
<header class="bg-white border-b border-gray-100 py-3 px-4">
  <div class="max-w-2xl mx-auto flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-7 h-7 bg-primary-600 rounded-lg flex items-center justify-center">
        <i class="fa-solid fa-box-ballot text-white text-xs"></i>
      </div>
      <span class="text-sm font-semibold text-gray-700" data-app-name>eVoting OSIM</span>
    </div>
    <button id="logout-btn" class="btn btn-sm btn-secondary text-xs">
      <i class="fa-solid fa-right-from-bracket"></i> Keluar
    </button>
  </div>
</header>

<!-- Main -->
<main class="flex-1 flex items-center justify-center p-6">
  <div class="max-w-md w-full text-center">

    <!-- Success icon -->
    <div class="check-animate inline-flex items-center justify-center w-28 h-28 bg-green-100 rounded-full mb-6 shadow-lg shadow-green-200/50">
      <div class="w-20 h-20 bg-green-500 rounded-full flex items-center justify-center">
        <i class="fa-solid fa-check text-white text-4xl"></i>
      </div>
    </div>

    <h1 class="text-2xl sm:text-3xl font-extrabold text-gray-800 mb-2">
      Suara Anda Telah Tercatat!
    </h1>
    <p class="text-gray-500 text-sm mb-6">
      Terima kasih telah berpartisipasi dalam pemilihan ini.<br/>
      Suara Anda sangat berarti.
    </p>

    <!-- Vote info card -->
    <div id="vote-info" class="card p-5 text-left mb-6 hidden">
      <p class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-3">Detail Suara Anda</p>
      <div class="space-y-2">
        <div class="flex items-center justify-between text-sm">
          <span class="text-gray-500">Pilihan Anda</span>
          <span class="font-semibold text-gray-800" id="voted-candidate"></span>
        </div>
        <div class="flex items-center justify-between text-sm">
          <span class="text-gray-500">No. Urut</span>
          <span class="font-medium text-gray-700" id="voted-order"></span>
        </div>
        <div class="flex items-center justify-between text-sm">
          <span class="text-gray-500">Waktu Pemilihan</span>
          <span class="font-medium text-gray-700" id="voted-time"></span>
        </div>
        <div class="flex items-center justify-between text-sm">
          <span class="text-gray-500">ID Verifikasi</span>
          <span class="font-mono text-xs text-gray-500 truncate max-w-36" id="voted-id"></span>
        </div>
      </div>
    </div>

    <!-- Voter info -->
    <div class="card p-5 mb-6 bg-primary-50 border-primary-200">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-primary-100 rounded-full flex items-center justify-center flex-shrink-0">
          <i class="fa-solid fa-user text-primary-600"></i>
        </div>
        <div class="text-left min-w-0">
          <p class="text-sm font-semibold text-gray-800 truncate" id="voter-display-name"></p>
          <p class="text-xs text-gray-500" id="voter-display-class"></p>
        </div>
        <div class="ml-auto">
          <span class="badge badge-success">
            <i class="fa-solid fa-circle-check text-xs"></i>
            Sudah Memilih
          </span>
        </div>
      </div>
    </div>

    <!-- Result link (jika publik) -->
    <div id="result-link-box" class="hidden mb-5">
      <a href="/results.html" class="btn btn-outline-primary w-full">
        <i class="fa-solid fa-chart-bar"></i>
        Lihat Hasil Pemilihan
      </a>
    </div>

    <div class="text-center">
      <p class="text-xs text-gray-400 mb-3">Anda akan secara otomatis keluar dari sistem ini.</p>
      <button id="logout-btn-main" class="btn btn-secondary btn-lg w-full">
        <i class="fa-solid fa-right-from-bracket"></i>
        Selesai &amp; Keluar
      </button>
    </div>
  </div>
</main>

<script src="/assets/js/config.js"></script>
<script src="/assets/js/utils.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/auth.js"></script>
<script src="/assets/js/components.js"></script>
<script>
(async () => {
  // Pastikan sudah login sebagai voter
  if (!Auth.requireVoter()) return;

  loadAppConfig();

  // Tampilkan data voter
  const voter = Auth.getUserData();
  if (voter) {
    document.getElementById('voter-display-name').textContent  = voter.name || 'Pemilih';
    document.getElementById('voter-display-class').textContent = voter.className || '';
  }

  // Tampilkan data vote dari session (kalau ada)
  const voteResultRaw = sessionStorage.getItem('ev_vote_result');
  if (voteResultRaw) {
    try {
      const voteResult = JSON.parse(voteResultRaw);
      const fullName = voteResult.candidateName +
        (voteResult.pairName ? ' & ' + voteResult.pairName : '');
      document.getElementById('voted-candidate').textContent = fullName;
      document.getElementById('voted-order').textContent     = 'No. ' + voteResult.orderNumber;
      document.getElementById('voted-time').textContent      = Utils.formatDateTime(voteResult.timestamp);
      document.getElementById('voted-id').textContent        = voteResult.voteId || '-';
      document.getElementById('vote-info').classList.remove('hidden');
    } catch (_) {}
  }

  // Cek apakah hasil publik diizinkan
  const configRes = await API.config.get().catch(() => null);
  if (configRes && configRes.success && configRes.data) {
    const showPublic = configRes.data.ALLOW_PUBLIC_RESULT === 'true';
    if (showPublic) {
      document.getElementById('result-link-box').classList.remove('hidden');
    }
  }

  // Confetti animation
  launchConfetti();

  // Auto logout setelah 2 menit
  setTimeout(() => Auth.logoutVoter(), 2 * 60 * 1000);

  // Logout buttons
  const doLogout = () => Auth.logoutVoter();
  document.getElementById('logout-btn').addEventListener('click', doLogout);
  document.getElementById('logout-btn-main').addEventListener('click', doLogout);
})();

function launchConfetti() {
  const container = document.getElementById('confetti-container');
  const colors = ['#3b82f6','#22c55e','#f59e0b','#ef4444','#8b5cf6','#06b6d4'];
  for (let i = 0; i < 60; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.cssText = `
      left: ${Math.random() * 100}vw;
      top: -20px;
      background: ${colors[Math.floor(Math.random() * colors.length)]};
      border-radius: ${Math.random() > 0.5 ? '50%' : '2px'};
      width: ${6 + Math.random() * 8}px;
      height: ${6 + Math.random() * 8}px;
      animation-duration: ${1.5 + Math.random() * 2}s;
      animation-delay: ${Math.random() * 0.8}s;
      transform: rotate(${Math.random() * 360}deg);
    `;
    container.appendChild(piece);
  }
  setTimeout(() => container.innerHTML = '', 4000);
}
</script>
</body>
</html>
